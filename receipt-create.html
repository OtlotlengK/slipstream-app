<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ValoraTap | Issue Receipt</title>
<script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>:root{--gold:#d0aa4b;--paper:#f7f5f0;--line:#e7e2d8}*{box-sizing:border-box}body{background:var(--paper);color:#171717}.wrap{max-width:920px;margin:auto}.card{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 2px 12px rgba(15,23,42,.04)}.label{font-size:10px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:#999287}.input{width:100%;padding:13px 14px;background:#fcfcfb;border:1px solid #ddd8ce;border-radius:12px;font-size:13px}.input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(208,170,75,.12)}.gold{color:#a47f2b}</style></head>
<body class="min-h-screen"><header class="bg-[#171717] text-white"><div class="wrap px-4 md:px-6 py-4 flex items-center justify-between"><a href="dashboard-v2.html" class="font-black tracking-[.16em] text-lg">VALORATAP</a><a href="receipts.html" class="text-xs font-bold px-3 py-2 rounded-xl bg-white/5">← Receipt Vault</a></div></header>
<main class="wrap px-4 md:px-6 py-8"><section class="mb-6"><div class="label gold">Receipt workspace</div><h1 class="text-3xl md:text-4xl font-black tracking-tight mt-1">Issue a receipt</h1><p class="text-sm text-slate-500 mt-2 max-w-2xl">Create a receipt for a payment that has already been confirmed. The receipt can then be verified and stored in your Receipt Vault.</p></section>
<section class="card p-5 md:p-7"><form id="receipt-form" class="space-y-5">
<div class="grid md:grid-cols-2 gap-4"><div><label class="label block mb-2 text-slate-600">Customer name</label><input id="customer" required maxlength="160" class="input" placeholder="e.g. John Doe"></div><div><label class="label block mb-2 text-slate-600">Customer email <span class="normal-case tracking-normal font-medium text-slate-400">(optional)</span></label><input id="email" type="email" maxlength="160" class="input" placeholder="customer@example.com"></div></div>
<div class="grid md:grid-cols-2 gap-4"><div><label class="label block mb-2 text-slate-600">Amount <span id="currency-code" class="normal-case tracking-normal font-black text-[#a47f2b]">ZAR</span></label><input id="amount" type="number" min="0.01" step="0.01" required class="input" placeholder="0.00"></div><div><label class="label block mb-2 text-slate-600">Payment method</label><select id="method" class="input"><option value="EFT">EFT · Bank Transfer</option><option value="Cash">Cash</option><option value="Card">Card</option><option value="Online">Online</option></select></div></div>
<div class="grid md:grid-cols-2 gap-4"><div><label class="label block mb-2 text-slate-600">Transaction category</label><select id="category" class="input"><option value="physical_goods">Physical product</option><option value="professional_service">Professional service</option><option value="digital_product">Digital product</option><option value="appointment">Appointment / session</option><option value="delivery">Delivery</option><option value="subscription">Subscription</option><option value="rental">Rental</option><option value="other">Other</option></select></div><div><label class="label block mb-2 text-slate-600">Description / items</label><input id="description" required maxlength="500" class="input" placeholder="e.g. Consulting Services"></div></div>
<div id="msg" class="hidden p-3 rounded-xl text-xs"></div><button id="issue" class="w-full bg-[#d0aa4b] hover:bg-[#d8b84c] text-[#151515] font-black py-4 rounded-xl shadow-lg">Generate receipt</button>
</form></section></main>
<script>
const SUPABASE_URL='https://pddjualtnhgmplampucn.supabase.co',KEY='sb_publishable_31VRHyY4ze-5FqJU7CKooA_PzYUIYCH',db=supabase.createClient(SUPABASE_URL,KEY);let user;
const currencySymbols={ZAR:'R',NGN:'₦',GHS:'GH₵',KES:'KSh',USD:'$',GBP:'£',EUR:'€',BWP:'P',NAD:'N$',ZMW:'ZK',ZWG:'ZiG',MZN:'MT',AUD:'A$',CAD:'C$',INR:'₹',AED:'د.إ',BRL:'R$',MXN:'$'};
function msg(t,error=true){const e=document.getElementById('msg');e.textContent=t;e.className='p-3 rounded-xl text-xs '+(error?'bg-red-50 text-red-700':'bg-emerald-50 text-emerald-700');e.classList.remove('hidden')}
async function init(){const{data:{session},error}=await db.auth.getSession();if(error||!session){location.href='login.html';return}user=session.user;const{data,error:e}=await db.from('business_profiles').select('currency_code').eq('merchant_id',user.id).maybeSingle();if(e){msg('Could not load your business currency. Please refresh.');return}const currency=data?.currency_code||'ZAR';document.getElementById('currency-code').textContent=currency;document.getElementById('amount').placeholder=(currencySymbols[currency]||currency)+' 0.00'}
document.getElementById('receipt-form').addEventListener('submit',async e=>{e.preventDefault();if(!user)return;const b=document.getElementById('issue');const a=Number(document.getElementById('amount').value);if(!Number.isFinite(a)||a<=0){msg('Enter a valid amount.');return}b.disabled=true;b.textContent='Securing Receipt…';const{data,error}=await db.rpc('issue_receipt',{p_customer_name:document.getElementById('customer').value.trim(),p_customer_email:document.getElementById('email').value.trim()||null,p_customer_phone:null,p_description:document.getElementById('description').value.trim(),p_amount:a,p_payment_method:document.getElementById('method').value,p_external_reference:null,p_transaction_category:document.getElementById('category').value,p_currency:document.getElementById('currency-code').textContent});if(error){msg(error.message);b.disabled=false;b.textContent='Generate receipt';return}const r=Array.isArray(data)?data[0]:data;if(!r?.verification_hash){msg('Receipt created but verification data was not returned.');b.disabled=false;b.textContent='Generate receipt';return}location.href='verify.html?hash='+encodeURIComponent(r.verification_hash)});
init();
</script></body></html>
