<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ValoraTap | Revenue</title>
<script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>body{background:#f4f2ed}.bg-blue-600{background:#b08d3b!important}.hover\:bg-blue-700:hover{background:#96772f!important}.text-blue-600{color:#a47f2b!important}input:focus,select:focus{border-color:#b08d3b!important;outline:none;box-shadow:0 0 0 2px rgba(176,141,59,.15)!important}</style>
</head>
<body class="min-h-screen font-sans text-slate-800">
<header class="bg-slate-900 text-white shadow-md"><div class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center"><div><div class="font-bold tracking-wider">VALORATAP</div><div class="text-[10px] text-slate-400 uppercase tracking-widest">Revenue Analytics</div></div><button onclick="location.href='index.html'" class="text-xs bg-slate-700 px-3 py-1.5 rounded-lg">Back to Dashboard</button></div></header>
<main class="max-w-5xl mx-auto p-4 space-y-5">
<section class="bg-white rounded-2xl border border-slate-200 shadow-sm p-5"><div class="flex flex-col md:flex-row md:items-end justify-between gap-4"><div><p class="text-xs font-bold uppercase tracking-wider text-slate-400">Revenue period</p><h1 id="period-title" class="text-2xl font-black text-slate-900 mt-1">Current Month</h1></div><div class="flex flex-wrap gap-2"><select id="month-select" onchange="selectMonth()" class="px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl"></select><button onclick="showCustomRange()" class="bg-slate-800 text-white px-4 py-2 rounded-xl text-xs font-semibold">Custom Range</button></div></div></section>
<section class="grid grid-cols-1 md:grid-cols-3 gap-4"><div class="bg-white rounded-2xl border border-slate-200 p-5"><p class="text-xs font-bold uppercase text-slate-400">Revenue</p><p id="revenue-total" class="text-3xl font-black mt-1">R 0.00</p></div><div class="bg-white rounded-2xl border border-slate-200 p-5"><p class="text-xs font-bold uppercase text-slate-400">Transactions</p><p id="transaction-count" class="text-3xl font-black mt-1">0</p></div><div class="bg-white rounded-2xl border border-slate-200 p-5"><p class="text-xs font-bold uppercase text-slate-400">Average Transaction</p><p id="average-value" class="text-3xl font-black mt-1">R 0.00</p></div></section>
<section class="bg-white rounded-2xl border border-slate-200 p-5"><div class="flex items-center justify-between mb-4"><h2 class="font-bold">Payment Methods</h2><span id="range-label" class="text-xs text-slate-400"></span></div><div id="method-breakdown" class="grid grid-cols-2 md:grid-cols-4 gap-3"></div></section>
<section id="custom-panel" class="hidden bg-white rounded-2xl border border-slate-200 p-5"><h2 class="font-bold mb-4">Calculate Revenue Between Dates</h2><div class="grid grid-cols-1 md:grid-cols-3 gap-3"><div><label class="block text-xs font-bold text-slate-500 mb-1">From</label><input id="from-date" type="date" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl"></div><div><label class="block text-xs font-bold text-slate-500 mb-1">To</label><input id="to-date" type="date" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl"></div><button onclick="calculateCustomRange()" class="self-end bg-blue-600 text-white px-4 py-2.5 rounded-xl font-semibold">Calculate Revenue</button></div></section>
<section class="bg-white rounded-2xl border border-slate-200 p-5"><h2 class="font-bold mb-4">Revenue Transactions</h2><div class="overflow-x-auto"><table class="w-full text-left"><thead><tr class="border-b text-[11px] uppercase text-slate-400"><th class="py-3 px-3">Date</th><th class="py-3 px-3">Receipt</th><th class="py-3 px-3">Customer</th><th class="py-3 px-3">Method</th><th class="py-3 px-3 text-right">Amount</th></tr></thead><tbody id="transaction-body" class="text-xs"></tbody></table></div></section>
</main>
<script>
const SUPABASE_URL='https://pddjualtnhgmplampucn.supabase.co';const SUPABASE_ANON_KEY='sb_publishable_31VRHyY4ze-5FqJU7CKooA_PzYUIYCH';const{createClient}=supabase;const db=createClient(SUPABASE_URL,SUPABASE_ANON_KEY);let user=null,receipts=[];
const money=n=>`R ${Number(n||0).toLocaleString('en-ZA',{minimumFractionDigits:2,maximumFractionDigits:2})}`;
const valid=r=>r.status!=='cancelled'&&r.status!=='refunded';
function monthStart(y,m){return new Date(y,m,1)} function monthEnd(y,m){return new Date(y,m+1,1)}
window.addEventListener('DOMContentLoaded',async()=>{const{data:{session}}=await db.auth.getSession();if(!session){location.href='login.html';return}user=session.user;const{data,error}=await db.from('receipts').select('id,receipt_no,customer_name,amount,payment_method,status,created_at,verification_hash').eq('merchant_id',user.id).order('created_at',{ascending:false});if(error){alert(error.message);return}receipts=data||[];buildMonths();selectCurrentMonth()});
function buildMonths(){const s=document.getElementById('month-select');const now=new Date();s.innerHTML='';for(let i=0;i<24;i++){const d=new Date(now.getFullYear(),now.getMonth()-i,1);const o=document.createElement('option');o.value=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;o.textContent=d.toLocaleDateString('en-ZA',{month:'long',year:'numeric'});s.appendChild(o)} }
function selectCurrentMonth(){const now=new Date();document.getElementById('month-select').value=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;selectMonth()}
function selectMonth(){const [y,m]=document.getElementById('month-select').value.split('-').map(Number);document.getElementById('custom-panel').classList.add('hidden');renderRange(monthStart(y,m-1),monthEnd(y,m-1),` ${new Date(y,m-1,1).toLocaleDateString('en-ZA',{month:'long',year:'numeric'})}`)}
function showCustomRange(){document.getElementById('custom-panel').classList.toggle('hidden')}
function calculateCustomRange(){const f=document.getElementById('from-date').value,t=document.getElementById('to-date').value;if(!f||!t||f>t){alert('Choose a valid From and To date.');return}renderRange(new Date(f+'T00:00:00'),new Date(t+'T00:00:00'),`${f} to ${t}`,true)}
function renderRange(start,end,label,inclusiveDate=false){const rs=receipts.filter(r=>valid(r)&&new Date(r.created_at)>=start&&new Date(r.created_at)<(inclusiveDate?new Date(end.getTime()+86400000):end));const total=rs.reduce((s,r)=>s+Number(r.amount),0);document.getElementById('period-title').textContent=label.trim();document.getElementById('range-label').textContent=`${rs.length} qualifying transaction${rs.length===1?'':'s'}`;document.getElementById('revenue-total').textContent=money(total);document.getElementById('transaction-count').textContent=rs.length;document.getElementById('average-value').textContent=money(rs.length?total/rs.length:0);const methods={Cash:0,EFT:0,Card:0,Online:0};rs.forEach(r=>{const k=Object.keys(methods).find(x=>x.toLowerCase()===String(r.payment_method||'').toLowerCase())||'Online';methods[k]+=Number(r.amount)});document.getElementById('method-breakdown').innerHTML=Object.entries(methods).map(([k,v])=>`<div class="rounded-xl bg-slate-50 border border-slate-100 p-3"><div class="text-[10px] font-bold uppercase text-slate-400">${k}</div><div class="font-black mt-1">${money(v)}</div></div>`).join('');document.getElementById('transaction-body').innerHTML=rs.length?rs.map(r=>`<tr class="border-b"><td class="py-3 px-3">${new Date(r.created_at).toLocaleString('en-ZA')}</td><td class="py-3 px-3 font-mono">${escapeHtml(r.receipt_no||r.verification_hash||'—')}</td><td class="py-3 px-3 font-medium">${escapeHtml(r.customer_name||'—')}</td><td class="py-3 px-3 uppercase">${escapeHtml(r.payment_method||'—')}</td><td class="py-3 px-3 text-right font-bold">${money(r.amount)}</td></tr>`).join(''):'<tr><td colspan="5" class="py-8 text-center text-slate-400">No qualifying revenue transactions in this period.</td></tr>'}
function escapeHtml(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;').replace(/'/g,'&#039;')}
</script>
</body></html>
