<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VynoTap | Security</title><script src="https://cdn.tailwindcss.com"></script><script src="/app-lock.js" defer></script><style>:root{--page:#F1F5F9;--surface:#fff;--ink:#0F172A;--muted:#64748B;--line:#E2E8F0}html[data-vt-theme="dark"]{--page:#0B1220;--surface:#151F30;--ink:#F8FAFC;--muted:#A8B4C7;--line:#334155}body{background:var(--page);color:var(--ink)}.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px}.muted{color:var(--muted)}.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;padding:12px 16px;border-radius:12px;font-size:13px;font-weight:850}.primary{background:#0F766E;color:white}.secondary{background:#F1F5F9;color:#334155;border:1px solid #CBD5E1}.warning{background:#F59E0B;color:#17201F}.danger{background:#FFF1F2;color:#BE123C;border:1px solid #FECDD3}html[data-vt-theme="dark"] .secondary{background:#1E293B;color:#E2E8F0;border-color:#475569}html[data-vt-theme="dark"] .danger{background:#3F151B;color:#FECACA;border-color:#991B1B}</style></head><body class="min-h-screen"><header style="background:var(--surface);border-bottom:1px solid var(--line)"><div class="max-w-2xl mx-auto px-4 py-4 flex items-center gap-4"><a href="settings.html" class="text-xl muted">‹</a><div><div class="font-black tracking-widest text-teal-700">VYNOTAP</div><div class="text-xs muted">Settings / Security</div></div></div></header><main class="max-w-2xl mx-auto p-4 py-7 space-y-4"><section><p class="text-xs font-black tracking-widest text-teal-700 uppercase">Protect this device</p><h1 class="text-3xl font-black mt-1">Security</h1></section><section class="card"><h2 class="text-lg font-black">App lock</h2><p class="text-sm muted mt-2">Keep your VynoTap session signed in while requiring your device PIN or biometric authentication when you return.</p><div class="mt-4"><span id="lock-status" class="inline-flex rounded-full px-3 py-2 text-xs font-bold bg-slate-100 text-slate-700">Checking…</span></div><div class="mt-4 grid gap-3"><button class="btn primary" onclick="setPin()">Set / Change PIN</button><button class="btn secondary" onclick="enableBiometric()">Enable fingerprint / Face ID</button><button class="btn warning" onclick="lockVT()">Lock now</button><button class="btn danger" onclick="disableLock()">Turn off app lock</button></div><p id="security-message" class="text-xs muted mt-3" role="status"></p></section></main><script>
function msg(t,e=false){const x=document.getElementById('security-message');x.textContent=t;x.className='text-xs mt-3 '+(e?'text-rose-600':'muted')}
function refresh(){const s=window.ValoraAppLock?.status?.()||{},el=document.getElementById('lock-status');if(!s.enabled){el.textContent='App lock: Off';el.className='inline-flex rounded-full px-3 py-2 text-xs font-bold bg-slate-100 text-slate-700'}else{el.textContent='App lock: On · '+[s.pin?'PIN':'',s.biometric?'Fingerprint / Face ID':''].filter(Boolean).join(' + ');el.className='inline-flex rounded-full px-3 py-2 text-xs font-bold bg-emerald-100 text-emerald-800'}}
function pinDialog(){return new Promise(resolve=>{const p=prompt('Enter a new 6–8 digit PIN, then confirm it in the next step.');if(p===null)return resolve(null);const c=prompt('Confirm your PIN.');if(c===null)return resolve(null);if(!/^[0-9]{6,8}$/.test(p)||p!==c){msg(p!==c?'The PINs did not match.':'PIN must contain 6–8 digits.',true);return resolve(null)}resolve(p)})}
async function setPin(){const p=await pinDialog();if(!p)return;try{await window.ValoraAppLock.setupPin(p);msg('VynoTap PIN enabled on this device.');refresh()}catch(e){msg(e.message||'Could not set PIN.',true)}}
async function enableBiometric(){if(!window.ValoraAppLock?.status?.().pin){msg('Set a PIN first. It remains your fallback if biometrics are unavailable.',true);return}try{await window.ValoraAppLock.setupBiometric();msg('Biometric unlock enabled. Your PIN remains available as a fallback.');refresh()}catch(e){msg(e.message||'Biometric unlock could not be enabled.',true)}}
function lockVT(){window.ValoraAppLock?.lockNow()}function disableLock(){if(!confirm('Turn off the VynoTap app lock on this device?'))return;window.ValoraAppLock?.disable();msg('App lock is off on this device.');refresh()}window.addEventListener('DOMContentLoaded',()=>setTimeout(refresh,100));
</script></body></html>
