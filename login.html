<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="application-name" content="ValoraTap"><meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2B2A6B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="VT">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/valoratap.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/valoratap.svg"><title>ValoraTap | Sign in</title>
<script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="min-h-screen bg-[#0F172A] text-slate-100 flex items-center justify-center p-4">
<div class="w-full max-w-md">
<header class="text-center mb-7">
<img src="/icons/valoratap.svg" alt="ValoraTap" class="w-20 h-20 mx-auto mb-4 object-contain">
<h1 class="text-3xl font-black tracking-tight text-white">ValoraTap</h1>
<p class="text-sm text-slate-400 mt-1">The trust layer for business transactions</p>
</header>
<section class="bg-[#111827] border border-slate-800 rounded-2xl p-6 shadow-2xl">
<h2 id="title" class="text-xl font-bold">Welcome back</h2><p id="subtitle" class="text-xs text-slate-400 mt-1 mb-6">Log in to your merchant dashboard.</p>
<div id="signup-fields" class="hidden space-y-4">
<label class="block text-xs font-bold uppercase tracking-wider text-slate-400">Business Name<input id="business" class="mt-1 w-full rounded-xl bg-[#0B1220] border border-slate-700 px-3.5 py-3 text-sm text-white" placeholder="e.g. Kgabi Solutions"></label>
<label class="block text-xs font-bold uppercase tracking-wider text-slate-400">Your Name<input id="owner" class="mt-1 w-full rounded-xl bg-[#0B1220] border border-slate-700 px-3.5 py-3 text-sm text-white" placeholder="e.g. Otlotleng Kgabi"></label>
</div>
<label class="block mt-4 text-xs font-bold uppercase tracking-wider text-slate-400">Email Address<input id="email" type="email" autocomplete="email" class="mt-1 w-full rounded-xl bg-[#0B1220] border border-slate-700 px-3.5 py-3 text-sm text-white" placeholder="you@example.com"></label>
<label class="block mt-4 text-xs font-bold uppercase tracking-wider text-slate-400">Password<input id="password" type="password" autocomplete="current-password" class="mt-1 w-full rounded-xl bg-[#0B1220] border border-slate-700 px-3.5 py-3 text-sm text-white" placeholder="Minimum 6 characters"></label>
<div id="message" class="hidden mt-4 p-3 rounded-xl text-xs"></div>
<button id="submit" class="w-full mt-5 bg-[#6C4CF1] hover:bg-[#8B7CF6] text-[#0F172A] font-black py-3 rounded-xl">Log In</button>
<button id="forgot" class="w-full mt-3 text-xs text-slate-400 hover:text-white font-bold">Forgot password?</button>
<button id="resend" class="hidden w-full mt-3 text-xs text-slate-300 hover:text-white font-bold">Resend verification email</button>
<button id="switch" class="w-full mt-4 text-xs text-[#8B7CF6] hover:text-white font-medium">Don't have an account? Create one</button>
<button id="install" class="hidden w-full mt-4 bg-white/5 border border-[#6C4CF1]/40 text-[#8B7CF6] font-bold py-3 rounded-xl">Install ValoraTap App</button>
</section><p class="text-center text-[10px] text-slate-600 mt-5">ValoraTap © 2026</p>
</div>
<script>
const SUPABASE_URL='https://pddjualtnhgmplampucn.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_31VRHyY4ze-5FqJU7CKooA_PzYUIYCH';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const verifyRedirect=new URL('/confirm-signup.html',location.origin).href;
const resetRedirect=new URL('/reset-password.html',location.origin).href;
let signup=new URLSearchParams(location.search).get('mode')==='signup';
const $=id=>document.getElementById(id);
function msg(t,error=false){$('message').textContent=t;$('message').className='mt-4 p-3 rounded-xl text-xs '+(error?'bg-red-950/50 text-red-300':'bg-emerald-950/50 text-emerald-300');}
function render(){ $('signup-fields').classList.toggle('hidden',!signup);$('title').textContent=signup?'Create your merchant account':'Welcome back';$('subtitle').textContent=signup?'Start issuing verifiable digital receipts.':'Log in to your merchant dashboard.';$('submit').textContent=signup?'Create Merchant Account':'Log In';$('switch').textContent=signup?'Already have an account? Log in':"Don't have an account? Create one";$('forgot').classList.toggle('hidden',signup);}
async function route(){const {data:{user}}=await db.auth.getUser();if(!user){location.href='/login.html';return}const {data}=await db.from('merchants').select('business_name,owner_name,phone').eq('id',user.id).maybeSingle();if(!data||!data.business_name||!data.owner_name){location.href='/onboarding.html';return}location.href='/index.html';}
async function submit(){const email=$('email').value.trim(),password=$('password').value,button=$('submit');if(!email||!password){msg('Please enter your email and password.',true);return}button.disabled=true;button.textContent=signup?'Creating account...':'Logging in...';$('resend').classList.add('hidden');
if(signup){const business=$('business').value.trim(),owner=$('owner').value.trim();if(!business||!owner){msg('Please enter your business name and your name.',true);button.disabled=false;render();return}
const {data,error}=await db.auth.signUp({email,password,options:{emailRedirectTo:verifyRedirect,data:{business_name:business,owner_name:owner}}});
if(error){msg(error.message,true)}else if(data.session){await route()}else{signup=false;render();$('email').value=email;$('password').value='';msg('Account created. Check your email to verify your ValoraTap account before logging in.');$('resend').classList.remove('hidden')}
}else{const {error}=await db.auth.signInWithPassword({email,password});if(error){msg(error.message,true);if(error.message.toLowerCase().includes('email not confirmed'))$('resend').classList.remove('hidden')}else await route()}
button.disabled=false;render();}
async function resend(){const email=$('email').value.trim();if(!email){msg('Enter your email address first.',true);return}const {error}=await db.auth.resend({type:'signup',email,options:{emailRedirectTo:verifyRedirect}});if(error)msg(error.message,true);else msg('Verification email sent. Check your inbox and spam/junk folder.')}
$('submit').onclick=submit;
$('forgot').onclick=()=>{const email=$('email').value.trim();location.href='/reset-password.html'+(email?'?email='+encodeURIComponent(email):'');};
$('switch').onclick=()=>{signup=!signup;render();$('resend').classList.add('hidden');$('message').classList.add('hidden')};
$('resend').onclick=resend;
(async()=>{const {data:{session}}=await db.auth.getSession();if(session)await route();else render()})();
let deferred=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;$('install').classList.remove('hidden')});$('install').onclick=async()=>{if(!deferred)return;deferred.prompt();await deferred.userChoice;deferred=null;$('install').classList.add('hidden')};
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
</script>
</body></html>
