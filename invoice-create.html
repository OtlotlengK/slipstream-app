<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>ValoraTap | Create Invoice</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--gold:#d0aa4b;--paper:#f5f2eb;--line:#e4ded2}body{background:var(--paper)}.card{background:#fff;border:1px solid var(--line);border-radius:22px}.input{width:100%;padding:12px 14px;border:1px solid #ddd8ce;border-radius:12px;background:#fcfcfb;font-size:13px}.input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px #d0aa4b22}.label{font-size:9px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:#777}.btn{border-radius:12px;padding:12px 16px;font-size:12px;font-weight:900}.gold{background:var(--gold);color:#171717}</style></head><body><header class="bg-[#171717] text-white"><div class="max-w-[1200px] mx-auto px-4 py-4 flex justify-between"><a href="invoice-centre.html" class="font-black tracking-[.16em]">VALORATAP</a><a href="invoice-centre.html" class="text-xs font-bold text-slate-300">← Invoice Centre</a></div></header><main class="max-w-[1200px] mx-auto px-4 py-8 md:py-10"><div class="mb-6"><div class="label text-[#9a7629]">New financial document</div><h1 class="text-3xl font-black mt-1">Create Invoice</h1><p class="text-sm text-slate-500 mt-2">Build a professional invoice and send a secure payment link to your client.</p></div><div class="grid lg:grid-cols-[1.15fr_.85fr] gap-6"><section class="card p-6 md:p-8"><form id="form" class="space-y-5" novalidate><div class="grid md:grid-cols-2 gap-4"><div><label class="label block mb-2">Client name</label><input id="name" required class="input" placeholder="Client / company name"></div><div><label class="label block mb-2">Client email</label><input id="email" type="email" class="input" placeholder="client@example.com"></div></div><div class="grid md:grid-cols-2 gap-4"><div><label class="label block mb-2">Issue date</label><input id="issue" type="date" required class="input"></div><div><label class="label block mb-2">Due date</label><input id="due" type="date" required class="input"></div></div><div><label class="label block mb-2">Description</label><input id="desc" required class="input" placeholder="e.g. Website development services"></div><div class="grid grid-cols-[1fr_110px] gap-4"><div><label class="label block mb-2">Unit price (ZAR)</label><input id="price" type="number" min="0.01" step="0.01" required class="input" placeholder="0.00"></div><div><label class="label block mb-2">Quantity</label><input id="qty" type="number" min="1" step="1" value="1" required class="input"></div></div><div><label class="label block mb-2">VAT rate</label><select id="vat" class="input"><option value="0">0%</option><option value="15">15%</option></select></div><div><label class="label block mb-2">Notes / payment terms</label><textarea id="notes" rows="4" class="input" placeholder="Payment terms, banking instructions or additional notes"></textarea></div><div id="msg" class="hidden p-3 rounded-xl text-xs"></div><button type="submit" class="btn gold w-full" id="submit">Create Secure Invoice →</button></form></section><section class="card p-6 md:p-8 h-fit sticky top-5"><div class="flex justify-between border-b-2 border-[#171717] pb-5"><div><div class="font-black tracking-[.16em]">VALORATAP</div><div class="text-[9px] text-slate-400 mt-1">SECURE BUSINESS DOCUMENT</div><div id="biz" class="text-xs font-bold mt-4">Your business</div></div><div class="text-right text-2xl font-black">INVOICE</div></div><div class="py-5"><div class="label">Bill to</div><div id="pname" class="font-black mt-1">Client name</div><div id="pdate" class="text-xs text-slate-400 mt-3">Issue date · Due date</div></div><div class="border-y py-5"><div class="flex justify-between text-xs font-bold"><span id="pdesc">Description</span><span id="pamount">R 0.00</span></div></div><div class="ml-auto max-w-xs pt-5 space-y-2 text-sm"><div class="flex justify-between"><span>Subtotal</span><b id="psub">R 0.00</b></div><div class="flex justify-between"><span>VAT</span><b id="pvat">R 0.00</b></div><div class="flex justify-between border-t-2 border-[#171717] pt-3 text-lg"><b>TOTAL</b><b id="ptotal">R 0.00</b></div></div></section></div></main><script>(()=>{const URL='https://pddjualtnhgmplampucn.supabase.co',KEY='sb_publishable_31VRHyY4ze-5FqJU7CKooA_PzYUIYCH',show=(text,type='error')=>{const m=document.getElementById('msg');m.textContent=text;m.className='p-3 rounded-xl '+(type==='ok'?'bg-emerald-50 text-emerald-700':'bg-red-50 text-red-700')};try{if(!window.supabase||typeof window.supabase.createClient!=='function')throw new Error('Secure connection library failed to load. Please refresh the page.');const db=window.supabase.createClient(URL,KEY),$=id=>document.getElementById(id),money=n=>new Intl.NumberFormat('en-ZA',{style:'currency',currency:'ZAR'}).format(Number(n)||0),today=new Date().toISOString().slice(0,10);$('issue').value=today;$('due').value=new Date(Date.now()+7*864e5).toISOString().slice(0,10);function preview(){const q=Math.max(1,Number($('qty').value)||1),p=Math.max(0,Number($('price').value)||0),sub=q*p,tax=sub*(Number($('vat').value)||0)/100;$('pname').textContent=$('name').value||'Client name';$('pdesc').textContent=$('desc').value||'Description';$('pdate').textContent=`Issued ${$('issue').value||'—'} · Due ${$('due').value||'—'}`;$('pamount').textContent=money(sub);$('psub').textContent=money(sub);$('pvat').textContent=money(tax);$('ptotal').textContent=money(sub+tax)}['name','issue','due','desc','price','qty','vat'].forEach(id=>$(id).addEventListener('input',preview));$('vat').addEventListener('change',preview);async function init(){try{const{data,error}=await db.auth.getSession();if(error)throw error;if(!data?.session){show('Your session has expired. Redirecting to login…');setTimeout(()=>location.href='login.html',700);return}const{data:merchant,error:merchantError}=await db.from('merchants').select('business_name').eq('id',data.session.user.id).maybeSingle();if(merchantError)console.warn('Merchant lookup:',merchantError);$('biz').textContent=merchant?.business_name||'Your business';preview()}catch(err){console.error(err);show('Could not load your secure session. Please refresh and sign in again.')}}$('form').addEventListener('submit',async e=>{e.preventDefault();e.stopPropagation();const btn=$('submit');show('');$('msg').className='hidden';const name=$('name').value.trim(),email=$('email').value.trim(),desc=$('desc').value.trim(),issue=$('issue').value,due=$('due').value,qty=Number($('qty').value),price=Number($('price').value),vat=Number($('vat').value)||0;if(!name||!desc||!issue||!due||!Number.isFinite(qty)||qty<1||!Number.isFinite(price)||price<=0){show('Please complete the client, description, dates, quantity and price fields.');return}if(due<issue){show('Due date cannot be earlier than the issue date.');return}if(!Number.isFinite(vat)||vat<0||vat>100){show('Invalid VAT rate.');return}btn.disabled=true;btn.textContent='Creating securely…';try{const{data:auth,error:authError}=await db.auth.getSession();if(authError)throw authError;if(!auth?.session)throw new Error('Your session has expired. Please sign in again.');const bytes=new Uint8Array(32);crypto.getRandomValues(bytes);const publicToken=Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join('');const payload={p_customer_name:name,p_customer_email:email||null,p_customer_phone:null,p_issue_date:issue,p_due_date:due,p_line_items:[{description:desc,quantity:qty,unit_price:price}],p_subtotal:Number((price*qty).toFixed(2)),p_tax_rate:vat,p_discount_amount:0,p_notes:$('notes').value.trim()||null,p_public_token:publicToken};const{data,error}=await db.rpc('create_invoice',payload);if(error)throw error;const r=Array.isArray(data)?data[0]:data;if(!r?.public_token)throw new Error('Invoice was created but no secure link was returned.');show('Invoice created successfully. Opening secure invoice…','ok');setTimeout(()=>{location.href='invoice.html?token='+encodeURIComponent(r.public_token)},150); }catch(err){console.error('Invoice creation failed:',err);show('Could not create invoice: '+(err?.message||'Unknown error'));btn.disabled=false;btn.textContent='Create Secure Invoice →'}});init();preview()}catch(err){console.error('Invoice page failed to initialize:',err);document.body.insertAdjacentHTML('afterbegin','<div style="position:fixed;top:0;left:0;right:0;z-index:9999;padding:12px 16px;background:#fee2e2;color:#991b1b;font:700 13px system-ui">ValoraTap could not initialize this page. Please refresh and sign in again.</div>')}})();</script></body></html>
