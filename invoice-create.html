<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ValoraTap | Create Invoice</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--gold:#d0aa4b;--paper:#f5f2eb;--line:#e4ded2}body{background:var(--paper)}.card{background:#fff;border:1px solid var(--line);border-radius:22px}.input{width:100%;padding:12px 14px;border:1px solid #ddd8ce;border-radius:12px;background:#fcfcfb;font-size:13px}.input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px #d0aa4b22}.label{font-size:9px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:#777}.btn{border-radius:12px;padding:12px 16px;font-size:12px;font-weight:900}.gold{background:var(--gold);color:#171717}</style></head><body><header class="bg-[#171717] text-white"><div class="max-w-[1200px] mx-auto px-4 py-4 flex justify-between"><a href="invoice-centre.html" class="font-black tracking-[.16em]">VALORATAP</a><a href="invoice-centre.html" class="text-xs font-bold text-slate-300">← Invoice Centre</a></div></header><main class="max-w-[1200px] mx-auto px-4 py-8 md:py-10"><div class="mb-6"><div class="label text-[#9a7629]">New financial document</div><h1 class="text-3xl font-black mt-1">Create Invoice</h1><p class="text-sm text-slate-500 mt-2">Build a professional invoice and send a secure payment link to your client.</p></div><div class="grid lg:grid-cols-[1.15fr_.85fr] gap-6"><section class="card p-6 md:p-8"><form id="form" class="space-y-5"><div class="grid md:grid-cols-2 gap-4"><div><label class="label block mb-2">Client name</label><input id="name" required class="input" placeholder="Client / company name"></div><div><label class="label block mb-2">Client email</label><input id="email" type="email" class="input" placeholder="client@example.com"></div></div><div class="grid md:grid-cols-2 gap-4"><div><label class="label block mb-2">Issue date</label><input id="issue" type="date" required class="input"></div><div><label class="label block mb-2">Due date</label><input id="due" type="date" required class="input"></div></div><div><label class="label block mb-2">Description</label><input id="desc" required class="input" placeholder="e.g. Website development services"></div><div class="grid grid-cols-[1fr_110px] gap-4"><div><label class="label block mb-2">Unit price (ZAR)</label><input id="price" type="number" min="0.01" step="0.01" required class="input" placeholder="0.00"></div><div><label class="label block mb-2">Quantity</label><input id="qty" type="number" min="1" step="1" value="1" required class="input"></div></div><div><label class="label block mb-2">VAT rate</label><select id="vat" class="input"><option value="0">0%</option><option value="15">15%</option></select></div><div><label class="label block mb-2">Notes / payment terms</label><textarea id="notes" rows="4" class="input" placeholder="Payment terms, banking instructions or additional notes"></textarea></div><div id="msg" class="hidden p-3 rounded-xl text-xs"></div><button class="btn gold w-full" id="submit">Create Secure Invoice →</button></form></section><section class="card p-6 md:p-8 h-fit sticky top-5"><div class="flex justify-between border-b-2 border-[#171717] pb-5"><div><div class="font-black tracking-[.16em]">VALORATAP</div><div class="text-[9px] text-slate-400 mt-1">SECURE BUSINESS DOCUMENT</div><div id="biz" class="text-xs font-bold mt-4">Your business</div></div><div class="text-right text-2xl font-black">INVOICE</div></div><div class="py-5"><div class="label">Bill to</div><div id="pname" class="font-black mt-1">Client name</div><div id="pdate" class="text-xs text-slate-400 mt-3">Issue date · Due date</div></div><div class="border-y py-5"><div class="flex justify-between text-xs font-bold"><span id="pdesc">Description</span><span id="pamount">R 0.00</span></div></div><div class="ml-auto max-w-xs pt-5 space-y-2 text-sm"><div class="flex justify-between"><span>Subtotal</span><b id="psub">R 0.00</b></div><div class="flex justify-between"><span>VAT</span><b id="pvat">R 0.00</b></div><div class="flex justify-between border-t-2 border-[#171717] pt-3 text-lg"><b>TOTAL</b><b id="ptotal">R 0.00</b></div></div></section></div></main><script>const URL='https://pddjualtnhgmplampucn.supabase.co',KEY='sb_publishable_31VRHyY4ze-5FqJU7CKooA_PzYUIYCH',db=supabase.createClient(URL,KEY);const $=id=>document.getElementById(id),money=n=>new Intl.NumberFormat('en-ZA',{style:'currency',currency:'ZAR'}).format(n);const today=new Date().toISOString().slice(0,10);$('issue').value=today;$('due').value=new Date(Date.now()+7*864e5).toISOString().slice(0,10);['name','issue','due','desc','price','qty','vat'].forEach(id=>$(id).addEventListener('input',preview));async function init(){const{data:{session}}=await db.auth.getSession();if(!session){location.href='login.html';return}const{data}=await db.from('merchants').select('business_name').eq('id',session.user.id).single();$('biz').textContent=data?.business_name||'Your business';preview()}function preview(){const q=Number($('qty').value)||1,p=Number($('price').value)||0,sub=q*p,tax=sub*(Number($('vat').value)||0)/100;$('pname').textContent=$('name').value||'Client name';$('pdesc').textContent=$('desc').value||'Description';$('pdate').textContent=`Issued ${$('issue').value||'—'} · Due ${$('due').value||'—'}`;$('pamount').textContent=money(sub);$('psub').textContent=money(sub);$('pvat').textContent=money(tax);$('ptotal').textContent=money(sub+tax)}$('form').addEventListener('submit',async e=>{e.preventDefault();$('submit').disabled=true;$('submit').textContent='Creating securely…';const{data,error}=await db.rpc('create_invoice',{p_customer_name:$('name').value.trim(),p_customer_email:$('email').value.trim()||null,p_issue_date:$('issue').value,p_due_date:$('due').value,p_line_items:[{description:$('desc').value.trim(),quantity:Number($('qty').value),unit_price:Number($('price').value)}],p_vat_rate:Number($('vat').value),p_notes:$('notes').value.trim()||null});if(error){$('msg').textContent='Could not create invoice: '+error.message;$('msg').className='p-3 rounded-xl bg-red-50 text-red-700';$('submit').disabled=false;$('submit').textContent='Create Secure Invoice →';return}const r=Array.isArray(data)?data[0]:data;if(r?.public_token){location.href='invoice-view.html?token='+encodeURIComponent(r.public_token)}else{location.href='invoice-centre.html'}});init();</script></body></html>
