<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="application-name" content="ValoraTap"><meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2B2A6B">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="VT">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icons/valoratap.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/valoratap.svg"><title>ValoraTap | Reset password</title>
<script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="min-h-screen bg-[#0F172A] text-slate-100 flex items-center justify-center p-4">
<div class="w-full max-w-md">
<header class="text-center mb-7">
<img src="/icons/valoratap.svg" alt="ValoraTap" class="w-20 h-20 mx-auto mb-4 object-contain">
<h1 class="text-3xl font-black tracking-tight text-white">ValoraTap</h1>
<p id="subtitle" class="text-sm text-slate-400 mt-1">Reset your merchant account password</p>
</header>
<section class="bg-[#111827] border border-slate-800 rounded-2xl p-6 shadow-2xl">
<div id="request-view">
<h2 class="text-xl font-bold">Forgot password?</h2>
<p class="text-xs text-slate-400 mt-1 mb-6">Enter your email and we'll send you a secure password reset link.</p>
<label class="block text-xs font-bold uppercase tracking-wider text-slate-400">Email Address
<input id="email" type="email" autocomplete="email" class="mt-1 w-full rounded-xl bg-[#0B1220] border border-slate-700 px-3.5 py-3 text-sm text-white" placeholder="you@example.com">
</label>
<button id="send" class="w-full mt-5 bg-[#6C4CF1] hover:bg-[#8B7CF6] text-[#0F172A] font-black py-3 rounded-xl">Send Reset Link</button>
</div>
<div id="change-view" class="hidden">
<h2 class="text-xl font-bold">Choose a new password</h2>
<p class="text-xs text-slate-400 mt-1 mb-6">Use a strong password you don't reuse elsewhere.</p>
<label class="block text-xs font-bold uppercase tracking-wider text-slate-400">New Password
<input id="new-password" type="password" autocomplete="new-password" class="mt-1 w-full rounded-xl bg-[#0B1220] border border-slate-700 px-3.5 py-3 text-sm text-white" placeholder="Minimum 6 characters">
</label>
<label class="block mt-4 text-xs font-bold uppercase tracking-wider text-slate-400">Confirm New Password
<input id="confirm-password" type="password" autocomplete="new-password" class="mt-1 w-full rounded-xl bg-[#0B1220] border border-slate-700 px-3.5 py-3 text-sm text-white" placeholder="Enter it again">
</label>
<button id="update" class="w-full mt-5 bg-[#6C4CF1] hover:bg-[#8B7CF6] text-[#0F172A] font-black py-3 rounded-xl">Update Password</button>
</div>
<div id="message" class="hidden mt-4 p-3 rounded-xl text-xs"></div>
<a href="/login.html" class="block text-center mt-4 text-xs text-[#8B7CF6] hover:text-white font-bold">Back to Log In</a>
</section>
<p class="text-center text-[10px] text-slate-600 mt-5">ValoraTap © 2026</p>
</div>
<script>
const SUPABASE_URL='https://pddjualtnhgmplampucn.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_31VRHyY4ze-5FqJU7CKooA_PzYUIYCH';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const resetRedirect=new URL('/reset-password.html',location.origin).href;
const $=id=>document.getElementById(id);
function msg(t,error=false){$('message').textContent=t;$('message').className='mt-4 p-3 rounded-xl text-xs '+(error?'bg-red-950/50 text-red-300':'bg-emerald-950/50 text-emerald-300');}
function showChange(){ $('request-view').classList.add('hidden');$('change-view').classList.remove('hidden');$('subtitle').textContent='Choose a new password for your account'; }
$('send').onclick=async()=>{const email=$('email').value.trim(),button=$('send');if(!email){msg('Enter your email address.',true);return}button.disabled=true;button.textContent='Sending...';const {error}=await db.auth.resetPasswordForEmail(email,{redirectTo:resetRedirect});if(error)msg('We could not send the reset email. Please try again.',true);else msg('If an account exists for that email, a password reset link has been sent. Check your inbox and spam/junk folder.');button.disabled=false;button.textContent='Send Reset Link';};
$('update').onclick=async()=>{const password=$('new-password').value,confirm=$('confirm-password').value,button=$('update');if(password.length<6){msg('Your password must be at least 6 characters.',true);return}if(password!==confirm){msg('The passwords do not match.',true);return}button.disabled=true;button.textContent='Updating...';const {error}=await db.auth.updateUser({password});if(error){msg(error.message,true);button.disabled=false;button.textContent='Update Password';return}msg('Password updated successfully. You can now log in with your new password.');$('new-password').value='';$('confirm-password').value='';button.disabled=false;button.textContent='Update Password';};
db.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY')showChange();});
(async()=>{const params=new URLSearchParams(location.search),email=params.get('email');if(email)$('email').value=email;const {data:{session}}=await db.auth.getSession();if(session)showChange();})();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
</script>
</body></html>
