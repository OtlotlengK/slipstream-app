<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ValoraTap | Business Setup</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-[#0b0d10] min-h-screen text-slate-100 flex items-center justify-center p-4">
<div class="w-full max-w-lg">
  <div class="text-center mb-7">
    <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-[#c9a227]/10 border border-[#c9a227]/30 mb-3"><span class="text-[#d8b84c] text-xl font-black">V</span></div>
    <h1 class="text-3xl font-black tracking-[0.12em] text-[#d8b84c]">VALORATAP</h1>
    <p class="text-sm text-slate-400 mt-1">Set up your business profile</p>
  </div>
  <div class="bg-[#14171c] rounded-2xl shadow-2xl border border-slate-800 p-6">
    <div class="mb-6">
      <p class="text-xs font-bold uppercase tracking-wider text-[#d8b84c]">Merchant onboarding</p>
      <h2 class="text-xl font-bold mt-1">Tell us about your business</h2>
      <p class="text-xs text-slate-400 mt-1">These details appear on your ValoraTap merchant account and can be updated later.</p>
    </div>
    <div class="space-y-4">
      <div><label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">Business Name</label><input id="business-name" type="text" required class="w-full px-3.5 py-3 text-sm bg-[#0d1014] border border-slate-700 text-white rounded-xl focus:outline-none focus:ring-2 focus:ring-[#c9a227]"></div>
      <div><label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">Owner / Contact Name</label><input id="owner-name" type="text" class="w-full px-3.5 py-3 text-sm bg-[#0d1014] border border-slate-700 text-white rounded-xl focus:outline-none focus:ring-2 focus:ring-[#c9a227]"></div>
      <div><label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">Business Phone</label><input id="phone" type="tel" placeholder="e.g. +27 71 234 5678" class="w-full px-3.5 py-3 text-sm bg-[#0d1014] border border-slate-700 text-white rounded-xl focus:outline-none focus:ring-2 focus:ring-[#c9a227]"></div>
    </div>
    <div id="message" class="hidden mt-4 p-3 rounded-xl text-xs"></div>
    <button id="save-btn" onclick="saveProfile()" class="w-full mt-5 bg-[#c9a227] hover:bg-[#d8b84c] text-[#0b0d10] font-bold py-3 rounded-xl">Save & Continue</button>
    <button onclick="window.location.href='index.html'" class="w-full mt-3 text-xs text-slate-500 hover:text-white">Skip for now</button>
  </div>
  <p class="text-center text-[10px] text-slate-600 mt-5">ValoraTap © 2026</p>
</div>
<script>
const SUPABASE_URL='https://pddjualtnhgmplampucn.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_31VRHyY4ze-5FqJU7CKooA_PzYUIYCH';
const{createClient}=supabase;const db=createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
let user=null;
function msg(text,error=false){const el=document.getElementById('message');el.textContent=text;el.className='mt-4 p-3 rounded-xl text-xs '+(error?'bg-red-950/50 text-red-300':'bg-emerald-950/50 text-emerald-300');el.classList.remove('hidden');}
async function init(){const{data:{session}}=await db.auth.getSession();if(!session){location.href='login.html';return}user=session.user;const{data,error}=await db.from('merchants').select('business_name,owner_name,phone').eq('id',user.id).single();if(error||!data){msg('We could not load your merchant profile. Please try again.',true);return}document.getElementById('business-name').value=data.business_name||'';document.getElementById('owner-name').value=data.owner_name||'';document.getElementById('phone').value=data.phone||'';}
async function saveProfile(){const business_name=document.getElementById('business-name').value.trim();const owner_name=document.getElementById('owner-name').value.trim();const phone=document.getElementById('phone').value.trim();if(!business_name){msg('Business name is required.',true);return}const btn=document.getElementById('save-btn');btn.disabled=true;btn.textContent='Saving...';const{error}=await db.from('merchants').update({business_name,owner_name,phone}).eq('id',user.id);if(error){msg(error.message,true);btn.disabled=false;btn.textContent='Save & Continue';return}window.location.href='index.html';}
window.addEventListener('DOMContentLoaded',init);
</script>
</body>
</html>
