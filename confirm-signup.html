<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#2B2A6B">\n<meta name="apple-mobile-web-app-capable" content="yes">\n<meta name="apple-mobile-web-app-title" content="VT">\n<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ValoraTap | Email Verified</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/valoratap.svg" type="image/svg+xml">\n<link rel="apple-touch-icon" href="/icons/valoratap.svg">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0F172A;color:#fff;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:flex;align-items:center;justify-content:center;padding:24px}.card{width:min(430px,100%);background:#111827;border:1px solid #262b33;border-radius:24px;padding:32px;text-align:center;box-shadow:0 24px 80px rgba(0,0,0,.45)}.mark{width:72px;height:72px;margin:0 auto 20px;border-radius:22px;display:flex;align-items:center;justify-content:center;background:#10b981;color:#fff;font-size:34px;font-weight:900}.logo{width:64px;height:64px;object-fit:contain}.eyebrow{font-size:11px;font-weight:900;letter-spacing:.18em;text-transform:uppercase;color:#6C4CF1}.btn{display:block;width:100%;margin-top:24px;padding:14px;border:0;border-radius:14px;background:#6C4CF1;color:#0F172A;font-weight:900;text-decoration:none;cursor:pointer}.muted{color:#94a3b8;font-size:13px;line-height:1.6;margin-top:10px}.error{color:#fca5a5}
</style>
</head>
<body>
<main class="card">
<div id="mark" class="mark">✓</div>
<div class="eyebrow">ValoraTap</div>
<h1 id="title">Email verified</h1>
<p id="message" class="muted">Your email address has been verified. Your ValoraTap account is ready.</p>
<a id="action" class="btn" href="/login.html">Continue to ValoraTap</a>
</main>
<script>
const SUPABASE_URL='https://pddjualtnhgmplampucn.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_31VRHyY4ze-5FqJU7CKooA_PzYUIYCH';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
async function init(){
  const hash=new URLSearchParams(location.hash.slice(1));
  const params=new URLSearchParams(location.search);
  const error=hash.get('error_description')||params.get('error_description');
  if(error){
    document.getElementById('mark').textContent='!';
    document.getElementById('mark').style.background='#ef4444';
    document.getElementById('title').textContent='Verification needs attention';
    document.getElementById('message').textContent=decodeURIComponent(error.replace(/\+/g,' '));
    document.getElementById('message').classList.add('error');
    return;
  }
  const {data:{session}}=await db.auth.getSession();
  if(session){
    document.getElementById('action').href='/index.html';
    setTimeout(()=>location.href='/index.html',1200);
  }
}
init();
</script>
</body>
</html>
