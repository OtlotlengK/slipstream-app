<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ValoraTap | Receipt Vault</title>
<script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{background:#f4f2ed}.gold-bg{background:#b08d3b!important}.gold-text{color:#a47f2b!important}.gold-border{border-color:#e8dcc0!important}
@media(max-width:640px){.desktop-table{display:none}.mobile-card{display:block!important}}
@media(min-width:641px){.mobile-card{display:none!important}}
</style>
</head>
<body class="min-h-screen font-sans text-slate-800">
<header class="bg-[#171717] text-white shadow-md"><div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center gap-3"><div><div class="font-black tracking-wider">VALORATAP</div><div class="text-[10px] text-slate-400 uppercase tracking-widest">Receipt Vault</div></div><button onclick="location.href='index.html'" class="text-xs bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-lg">Back to Dashboard</button></div></header>
<main class="max-w-6xl mx-auto p-4 space-y-5">
<section class="bg-white rounded-2xl border border-slate-200 shadow-sm p-5"><div class="flex flex-col md:flex-row md:items-center justify-between gap-3"><div><h1 class="text-2xl font-black text-slate-900">Receipt Vault</h1><p class="text-xs text-slate-400 mt-1">Search, filter, analyse and verify your complete transaction history.</p></div><div class="flex gap-2"><button onclick="exportCsv()" class="text-xs font-bold bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-2 rounded-xl">Export CSV</button><div id="count" class="text-xs font-bold text-slate-500 self-center"></div></div></div>
<div class="grid grid-cols-1 md:grid-cols-6 gap-2 mt-5"><input id="q" type="search" placeholder="Search receipt, customer, phone, email, item, amount or hash..." class="md:col-span-3 px-3.5 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#b08d3b]/20" oninput="render()"><select id="method" onchange="render()" class="px-3 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl"><option value="">All methods</option><option>Cash</option><option>EFT</option><option>Card</option><option>Online</option></select><select id="status" onchange="render()" class="px-3 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl"><option value="">All statuses</option><option value="issued">Issued</option><option value="cancelled">Cancelled</option><option value="refunded">Refunded</option></select></div>
<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 mt-3"><div><label class="block text-[10px] uppercase tracking-wider font-bold text-slate-400 mb-1">From</label><input id="from" type="date" onchange="render()" class="w-full px-3 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl"></div><div><label class="block text-[10px] uppercase tracking-wider font-bold text-slate-400 mb-1">To</label><input id="to" type="date" onchange="render()" class="w-full px-3 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl"></div><div class="sm:col-span-2 flex items-end"><button onclick="clearFilters()" class="w-full sm:w-auto px-4 py-2.5 text-xs font-bold bg-white border border-slate-200 hover:bg-slate-50 rounded-xl">Clear Filters</button></div></div>
</section>
<section class="grid grid-cols-2 lg:grid-cols-4 gap-3"><div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-4"><div class="text-[10px] uppercase tracking-wider font-bold text-slate-400">Filtered Revenue</div><div id="sum" class="text-xl font-black text-slate-900 mt-1">R 0.00</div></div><div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-4"><div class="text-[10px] uppercase tracking-wider font-bold text-slate-400">Transactions</div><div id="txns" class="text-xl font-black text-slate-900 mt-1">0</div></div><div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-4"><div class="text-[10px] uppercase tracking-wider font-bold text-slate-400">Average</div><div id="avg" class="text-xl font-black text-slate-900 mt-1">R 0.00</div></div><div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-4"><div class="text-[10px] uppercase tracking-wider font-bold text-slate-400">Active / Exceptions</div><div id="health" class="text-xl font-black text-slate-900 mt-1">0 / 0</div></div></section>
<section class="bg-white rounded-2xl border border-slate-200 shadow-sm p-4">
<div class="desktop-table overflow-x-auto"><table class="w-full text-left"><thead><tr class="border-b border-slate-100 text-[10px] uppercase tracking-wider text-slate-400"><th class="py-3 px-3">Receipt</th><th class="py-3 px-3">Customer</th><th class="py-3 px-3">Description</th><th class="py-3 px-3">Date</th><th class="py-3 px-3">Amount</th><th class="py-3 px-3">Status</th><th class="py-3 px-3 text-right">Action</th></tr></thead><tbody id="rows" class="text-xs"></tbody></table></div>
<div id="cards" class="mobile-card space-y-3"></div><div id="empty" class="hidden py-12 text-center text-sm text-slate-400">No receipts match your filters.</div>
</section>
</main>
<script>
const SUPABASE_URL='https://pddjualtnhgmplampucn.supabase.co';const SUPABASE_ANON_KEY='sb_publishable_31VRHyY4ze-5FqJU7CKooA_PzYUIYCH';const db=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);let user=null,receipts=[];
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;').replace(/'/g,'&#039;');
const money=n=>`R ${Number(n||0).toLocaleString('en-ZA',{minimumFractionDigits:2,maximumFractionDigits:2})}`;
const hash=h=>{h=String(h||'');return h.length>18?h.slice(0,9)+'…'+h.slice(-7):h||'—'};
const statusClass=s=>s==='cancelled'||s==='refunded'?'bg-amber-100 text-amber-700':'bg-emerald-100 text-emerald-700';
const verify=id=>`verify.html?id=${encodeURIComponent(id)}`;
const active=r=>!['cancelled','refunded'].includes(String(r.status||'').toLowerCase());
async function init(){const{data:{session}}=await db.auth.getSession();if(!session){location.href='login.html';return}user=session.user;const{data,error}=await db.from('receipts').select('id,receipt_no,customer_name,customer_phone,customer_email,description,items,amount,payment_method,status,created_at,verification_hash').eq('merchant_id',user.id).order('created_at',{ascending:false});if(error){document.getElementById('empty').classList.remove('hidden');document.getElementById('empty').textContent=error.message;return}receipts=data||[];render()}
function searchable(r){return [r.receipt_no,r.customer_name,r.customer_phone,r.customer_email,r.description,r.items,r.amount,r.payment_method,r.verification_hash,r.status].join(' ').toLowerCase()}
function filtered(){const q=document.getElementById('q').value.trim().toLowerCase(),m=document.getElementById('method').value.toLowerCase(),s=document.getElementById('status').value.toLowerCase(),f=document.getElementById('from').value,t=document.getElementById('to').value;return receipts.filter(r=>{const d=new Date(r.created_at);const day=new Date(d.getFullYear(),d.getMonth(),d.getDate());const from=f?new Date(f+'T00:00:00'):null;const to=t?new Date(t+'T23:59:59'):null;return(!q||searchable(r).includes(q))&&(!m||String(r.payment_method||'').toLowerCase()===m)&&(!s||String(r.status||'').toLowerCase()===s)&&(!from||day>=from)&&(!to||day<=to)})}
function render(){const list=filtered(),activeList=list.filter(active),revenue=activeList.reduce((a,r)=>a+Number(r.amount||0),0),exceptions=list.length-activeList.length;document.getElementById('count').textContent=`${list.length} of ${receipts.length} receipts`;document.getElementById('sum').textContent=money(revenue);document.getElementById('txns').textContent=list.length;document.getElementById('avg').textContent=money(activeList.length?revenue/activeList.length:0);document.getElementById('health').textContent=`${activeList.length} / ${exceptions}`;document.getElementById('empty').classList.toggle('hidden',list.length>0);document.getElementById('rows').innerHTML=list.map(row).join('');document.getElementById('cards').innerHTML=list.map(card).join('')}
function row(r){return `<tr class="border-b border-slate-100 hover:bg-slate-50"><td class="py-3 px-3"><div class="font-bold">${esc(r.receipt_no||'—')}</div><div class="font-mono text-[10px] gold-text mt-1">${esc(hash(r.verification_hash))}</div></td><td class="py-3 px-3"><div class="font-medium">${esc(r.customer_name||'—')}</div><div class="text-[10px] text-slate-400">${esc(r.customer_phone||r.customer_email||'')}</div></td><td class="py-3 px-3 max-w-xs">${esc(r.description||r.items||'—')}</td><td class="py-3 px-3 whitespace-nowrap">${esc(new Date(r.created_at).toLocaleString('en-ZA'))}</td><td class="py-3 px-3 font-black">${money(r.amount)}</td><td class="py-3 px-3"><span class="px-2 py-1 rounded-full text-[9px] font-bold uppercase ${statusClass(r.status)}">${esc(r.status||'issued')}</span></td><td class="py-3 px-3 text-right"><a href="${verify(r.id)}" class="inline-flex bg-[#b08d3b] hover:bg-[#96752f] text-white font-bold px-3 py-2 rounded-lg text-[10px]">View / Verify</a></td></tr>`}
function card(r){return `<article class="border border-slate-200 rounded-2xl p-4 space-y-3"><div class="flex justify-between gap-3"><div><div class="font-black text-sm">${esc(r.receipt_no||'Receipt')}</div><div class="font-mono text-[10px] gold-text mt-1">${esc(hash(r.verification_hash))}</div></div><span class="shrink-0 px-2 py-1 rounded-full text-[9px] font-bold uppercase h-fit ${statusClass(r.status)}">${esc(r.status||'issued')}</span></div><div class="grid grid-cols-2 gap-3 text-xs"><div><div class="text-[9px] uppercase font-bold text-slate-400">Customer</div><div class="font-semibold mt-1">${esc(r.customer_name||'—')}</div></div><div><div class="text-[9px] uppercase font-bold text-slate-400">Amount</div><div class="font-black mt-1">${money(r.amount)}</div></div><div><div class="text-[9px] uppercase font-bold text-slate-400">Method</div><div class="font-semibold mt-1 uppercase">${esc(r.payment_method||'—')}</div></div><div><div class="text-[9px] uppercase font-bold text-slate-400">Date</div><div class="font-semibold mt-1">${esc(new Date(r.created_at).toLocaleDateString('en-ZA'))}</div></div></div><div class="text-xs text-slate-500 border-t pt-3">${esc(r.description||r.items||'No description')}</div><a href="${verify(r.id)}" class="block text-center bg-[#b08d3b] hover:bg-[#96752f] text-white font-bold py-3 rounded-xl text-xs">View / Verify Receipt →</a></article>`}
function clearFilters(){document.getElementById('q').value='';document.getElementById('method').value='';document.getElementById('status').value='';document.getElementById('from').value='';document.getElementById('to').value='';render()}
function csvCell(v){return '"'+String(v??'').replace(/"/g,'""')+'"'}
function exportCsv(){const list=filtered();if(!list.length)return;const header=['Receipt','Customer','Phone','Email','Description','Amount','Payment Method','Status','Date','Verification Hash'];const lines=[header,...list.map(r=>[r.receipt_no,r.customer_name,r.customer_phone,r.customer_email,r.description||r.items,r.amount,r.payment_method,r.status,r.created_at,r.verification_hash])].map(row=>row.map(csvCell).join(','));const blob=new Blob([lines.join('\n')],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`valoratap-receipts-${new Date().toISOString().slice(0,10)}.csv`;a.click();URL.revokeObjectURL(a.href)}
init();
</script>
</body></html>
