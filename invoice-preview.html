<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>ValoraTap | Invoice Preview</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{background:#f5f2eb;color:#171717}.card{background:#fff;border:1px solid #e4ded2;border-radius:22px}.gold{color:#b08d3b}.label{font-size:9px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:#8d867a}</style></head><body><header class="bg-[#171717] text-white"><div class="max-w-4xl mx-auto px-5 py-4 flex justify-between items-center"><a href="index.html" class="font-black tracking-[.16em]">VALORATAP</a><a href="invoice-centre.html" class="text-xs font-bold bg-white text-[#171717] px-3 py-2 rounded-lg">Invoice Centre</a></div></header><main class="max-w-4xl mx-auto px-5 py-8"><div id="app" class="card p-6 md:p-9">Loading invoice…</div></main><script>const db=supabase.createClient('https://pddjualtnhgmplampucn.supabase.co','sb_publishable_31VRHyY4ze-5FqJU7CKooA_PzYUIYCH');const id=new URLSearchParams(location.search).get('id');const money=n=>new Intl.NumberFormat('en-ZA',{style:'currency',currency:'ZAR'}).format(Number(n)||0);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));async function init(){const{data:{session}}=await db.auth.getSession();if(!session){location.href='login.html';return}if(!id||!/^[0-9a-f-]{36}$/i.test(id)){document.querySelector('#app').textContent='Invalid invoice.';return}const{data:r,error}=await db.from('invoices').select('id,invoice_no,customer_name,customer_email,customer_phone,issue_date,due_date,currency,line_items,subtotal,tax_rate,tax_amount,discount_amount,total,notes,status,payment_submitted_at,payment_confirmed_at,payment_rejected_at,payment_rejection_reason,receipt_id,receipt_verification_hash,created_at').eq('id',id).eq('merchant_id',session.user.id).single();if(error||!r){document.querySelector('#app').textContent='Invoice not found.';return}const items=Array.isArray(r.line_items)?r.line_items:[];document.querySelector('#app').innerHTML=`<div class="flex justify-between gap-4 border-b pb-6"><div><div class="font-black text-2xl">VALORATAP</div><div class="label mt-1">Merchant invoice preview</div></div><div class="text-right"><div class="label">Invoice</div><div class="font-black mt-1">${esc(r.invoice_no)}</div></div></div><div class="grid md:grid-cols-2 gap-6 py-7 border-b"><div><div class="label">Bill to</div><div class="font-black mt-2">${esc(r.customer_name)}</div><div class="text-sm text-slate-500">${esc(r.customer_email||'')}</div><div class="text-sm text-slate-500">${esc(r.customer_phone||'')}</div></div><div class="md:text-right"><div><span class="label">Issue</span> ${esc(r.issue_date||'—')}</div><div class="mt-2"><span class="label">Due</span> ${esc(r.due_date||'—')}</div><div class="mt-3 inline-block px-3 py-1 rounded-full bg-slate-100 text-[10px] font-black uppercase">${esc(r.status.replace('_',' '))}</div></div></div><div class="py-6"><div class="label mb-3">Line items</div>${items.length?items.map(i=>`<div class="flex justify-between gap-4 py-3 border-b"><div><div class="font-bold">${esc(i.description||i.name||'Item')}</div><div class="text-xs text-slate-400">Qty ${esc(i.quantity??1)} · ${money(i.unit_price??i.price??0)} each</div></div><div class="font-black">${money(i.total??((Number(i.quantity)||1)*(Number(i.unit_price??i.price)||0)))}</div></div>`).join(''):'<div class="text-sm text-slate-500">No line items recorded.</div>'}</div><div class="ml-auto max-w-xs space-y-2 border-t pt-5"><div class="flex justify-between text-sm"><span>Subtotal</span><b>${money(r.subtotal)}</b></div><div class="flex justify-between text-sm"><span>Tax (${Number(r.tax_rate||0)}%)</span><b>${money(r.tax_amount)}</b></div><div class="flex justify-between text-sm"><span>Discount</span><b>− ${money(r.discount_amount)}</b></div><div class="flex justify-between text-xl font-black pt-2"><span>Total</span><span>${money(r.total)}</span></div></div>${r.notes?`<div class="mt-7 p-4 rounded-xl bg-[#faf8f3] text-sm"><div class="label mb-2">Notes / payment instructions</div>${esc(r.notes)}</div>`:''}${r.status==='payment_submitted'?'<div class="mt-7 p-4 rounded-xl bg-amber-50 text-amber-800 text-sm font-bold">Payment evidence submitted — review it from the Invoice Centre.</div>':''}${r.status==='paid'?'<div class="mt-7 p-4 rounded-xl bg-emerald-50 text-emerald-800 text-sm font-bold">Payment confirmed. Receipt has been issued.</div>':''}${r.status==='rejected'?`<div class="mt-7 p-4 rounded-xl bg-red-50 text-red-700 text-sm"><b>Payment rejected.</b><div class="mt-1">${esc(r.payment_rejection_reason||'No reason provided.')}</div></div>`:''}</div>`}init();</script></body></html>
