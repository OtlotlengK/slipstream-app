<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VynoTap | Appearance</title><script src="https://cdn.tailwindcss.com"></script><script src="/app-lock.js" defer></script><style>:root{--page:#F1F5F9;--surface:#fff;--ink:#0F172A;--muted:#64748B;--line:#E2E8F0}html[data-vt-theme="dark"]{--page:#0B1220;--surface:#151F30;--ink:#F8FAFC;--muted:#A8B4C7;--line:#334155}body{background:var(--page);color:var(--ink)}.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px}.muted{color:var(--muted)}.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;padding:12px 16px;border-radius:12px;font-size:13px;font-weight:850}.primary{background:#0F766E;color:white}.secondary{background:#F1F5F9;color:#334155;border:1px solid #CBD5E1}.warning{background:#F59E0B;color:#17201F}.danger{background:#FFF1F2;color:#BE123C;border:1px solid #FECDD3}html[data-vt-theme="dark"] .secondary{background:#1E293B;color:#E2E8F0;border-color:#475569}html[data-vt-theme="dark"] .danger{background:#3F151B;color:#FECACA;border-color:#991B1B}</style></head><body class="min-h-screen"><header style="background:var(--surface);border-bottom:1px solid var(--line)"><div class="max-w-2xl mx-auto px-4 py-4 flex items-center gap-4"><a href="settings.html" class="text-xl muted">‹</a><div><div class="font-black tracking-widest text-teal-700">VYNOTAP</div><div class="text-xs muted">Settings / Appearance</div></div></div></header><main class="max-w-2xl mx-auto p-4 py-7 space-y-4"><section><p class="text-xs font-black tracking-widest text-teal-700 uppercase">Make it yours</p><h1 class="text-3xl font-black mt-1">Appearance</h1></section><section class="card"><h2 class="text-lg font-black">Theme</h2><p class="text-sm muted mt-2">Choose how VynoTap looks on this device.</p><label class="block text-xs font-bold muted mt-4 mb-2" for="vt-theme-select">Theme preference</label><select id="vt-theme-select" data-vt-theme-select class="w-full rounded-xl border border-slate-300 p-3 bg-white text-slate-900"><option value="system">Follow device settings</option><option value="light">Always light</option><option value="dark">Always dark</option></select></section></main><script>
window.addEventListener('DOMContentLoaded',()=>{const select=document.getElementById('vt-theme-select');const key='vt_theme_preference_v1';let current='system';try{current=localStorage.getItem(key)||'system'}catch(e){}select.value=current;select.addEventListener('change',()=>{const value=select.value;try{localStorage.setItem(key,value)}catch(e){}const dark=value==='dark'||(value==='system'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.vtTheme=dark?'dark':'light';document.documentElement.dataset.vtThemePreference=value;document.documentElement.style.colorScheme=dark?'dark':'light'})});
</script></body></html>
