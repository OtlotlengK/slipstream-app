<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slipstream | Digital Receipts</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col justify-between font-sans text-slate-800">

    <!-- Top Navigation Bar -->
    <header class="bg-blue-600 text-white shadow-md">
        <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="font-bold text-lg tracking-wider">SLIPSTREAM</h1>
            <span id="nav-badge" class="text-xs bg-blue-700 px-2.5 py-1 rounded-full uppercase tracking-wide font-medium">Merchant Portal</span>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-md w-full mx-auto p-4 flex-grow flex flex-col justify-center">

        <!-- VIEW 1: MERCHANT FORM -->
        <div id="merchant-view" class="bg-white rounded-2xl shadow-sm p-6 border border-slate-200">
            <div class="mb-5">
                <h2 class="text-xl font-bold text-slate-900">Create Instant Receipt</h2>
                <p class="text-xs text-slate-500 mt-0.5">Fill in the sale details below to generate and save a digital receipt.</p>
            </div>

            <form id="receipt-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Customer Name / Handle</label>
                    <input type="text" id="cust-name" required placeholder="e.g. Sipho Dlamini" class="w-full px-3.5 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all">
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Customer Phone Number (WhatsApp)</label>
                    <input type="tel" id="cust-phone" required placeholder="e.g. 082 123 4567" class="w-full px-3.5 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all">
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Item / Product Sold</label>
                    <input type="text" id="item-desc" required placeholder="e.g. Custom Unit - 18 inch Bone Straight" class="w-full px-3.5 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all">
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Amount (ZAR)</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-sm font-semibold text-slate-400">R</span>
                        <input type="number" id="item-amount" required placeholder="1200.00" class="w-full pl-8 pr-3.5 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all">
                    </div>
                </div>

                <button type="submit" id="submit-btn" class="w-full mt-2 bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-xl transition-all shadow-sm text-sm">
                    Generate & Save Receipt
                </button>
            </form>
        </div>

        <!-- VIEW 2: CUSTOMER DIGITAL RECEIPT (Hidden by default) -->
        <div id="receipt-view" class="hidden bg-white rounded-2xl shadow-sm p-6 border border-slate-200 space-y-5">
            <div class="text-center pb-4 border-b border-dashed border-slate-200">
                <div class="inline-flex items-center justify-center w-12 h-12 bg-emerald-50 text-emerald-600 rounded-full mb-2">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                </div>
                <h2 class="text-lg font-bold text-slate-900">Payment Verified & Saved</h2>
                <p class="text-xs text-slate-500">Official Cloud Digital Proof of Purchase</p>
            </div>

            <div class="space-y-3 text-sm">
                <div class="flex justify-between py-1 border-b border-slate-50">
                    <span class="text-slate-400 text-xs uppercase tracking-wider font-medium">Receipt No</span>
                    <span id="res-id" class="font-mono font-semibold text-slate-700"></span>
                </div>
                <div class="flex justify-between py-1 border-b border-slate-50">
                    <span class="text-slate-400 text-xs uppercase tracking-wider font-medium">Date</span>
                    <span id="res-date" class="font-medium text-slate-700"></span>
                </div>
                <div class="flex justify-between py-1 border-b border-slate-50">
                    <span class="text-slate-400 text-xs uppercase tracking-wider font-medium">Customer</span>
                    <span id="res-customer" class="font-medium text-slate-700"></span>
                </div>
                <div class="flex justify-between py-1 border-b border-slate-50">
                    <span class="text-slate-400 text-xs uppercase tracking-wider font-medium">Item</span>
                    <span id="res-item" class="font-medium text-slate-700 text-right max-w-[180px] truncate"></span>
                </div>
                <div class="flex justify-between py-2 text-base font-bold text-slate-900">
                    <span>Total Paid</span>
                    <span id="res-total" class="text-blue-600"></span>
                </div>
            </div>

            <div class="pt-2 space-y-2">
                <a id="whatsapp-share-btn" href="#" target="_blank" class="w-full flex items-center justify-center gap-2 bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-3 rounded-xl transition-all shadow-sm text-sm">
                    Share Receipt via WhatsApp
                </a>
                <button onclick="resetForm()" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-600 font-medium py-2.5 rounded-xl transition-all text-xs">
                    Create Another Receipt
                </button>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="text-center py-4 text-xs text-slate-400">
        Powered by Slipstream &copy; 2026
    </footer>

    <!-- Logic Script & Supabase Integration -->
    <script>
        // REPLACE THESE WITH YOUR ACTUAL SUPABASE API KEYS FROM PROJECT SETTINGS -> API
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';

        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const form = document.getElementById('receipt-form');
        const merchantView = document.getElementById('merchant-view');
        const receiptView = document.getElementById('receipt-view');
        const navBadge = document.getElementById('nav-badge');
        const submitBtn = document.getElementById('submit-btn');

        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            submitBtn.textContent = "Saving to Cloud...";
            submitBtn.disabled = true;

            // Grab form data
            const name = document.getElementById('cust-name').value;
            const phone = document.getElementById('cust-phone').value;
            const item = document.getElementById('item-desc').value;
            const amount = parseFloat(document.getElementById('item-amount').value).toFixed(2);

            // Generate unique receipt metadata
            const receiptId = 'SS-' + Math.floor(100000 + Math.random() * 900000);
            const currentDate = new Date().toLocaleDateString('en-ZA', { year: 'numeric', month: 'short', day: 'numeric' });

            // Save to Supabase Database
            const { error } = await _supabase
                .from('receipts')
                .insert([
                    { 
                        receipt_no: receiptId, 
                        customer_name: name, 
                        customer_phone: phone, 
                        item_desc: item, 
                        amount: parseFloat(amount) 
                    }
                ]);

            if (error) {
                alert('Error saving receipt: ' + error.message);
                submitBtn.textContent = "Generate & Save Receipt";
                submitBtn.disabled = false;
                return;
            }

            // Populate Receipt View elements
            document.getElementById('res-id').textContent = receiptId;
            document.getElementById('res-date').textContent = currentDate;
            document.getElementById('res-customer').textContent = name;
            document.getElementById('res-item').textContent = item;
            document.getElementById('res-total').textContent = 'R ' + amount;

            // Build WhatsApp Share Link
            const shareText = `Hi ${name}, here is your digital receipt from Kgabi Solutions PTY LTD for ${item} (Amount: R ${amount}). Receipt Ref: ${receiptId}. Thank you for your support!`;
            const encodedText = encodeURIComponent(shareText);
            const cleanPhone = phone.replace(/\D/g, '');
            document.getElementById('whatsapp-share-btn').href = `https://wa.me/${cleanPhone}?text=${encodedText}`;

            // Reset button state
            submitBtn.textContent = "Generate & Save Receipt";
            submitBtn.disabled = false;

            // Switch views smoothly
            merchantView.classList.add('hidden');
            receiptView.classList.remove('hidden');
            navBadge.textContent = "Customer View";
        });

        function resetForm() {
            form.reset();
            receiptView.classList.add('hidden');
            merchantView.classList.remove('hidden');
            navBadge.textContent = "Merchant Portal";
        }
    </script>
</body>
</html>
