<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slipstream | Merchant Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col justify-between font-sans text-slate-800">

    <!-- Top Navigation Bar -->
    <header class="bg-blue-600 text-white shadow-md">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <h1 class="font-bold text-lg tracking-wider">SLIPSTREAM</h1>
                <span class="bg-blue-500 text-[10px] font-semibold px-2 py-0.5 rounded-full uppercase tracking-wide">Secure Protocol</span>
            </div>
            <div class="flex items-center gap-4">
                <span id="nav-badge" class="text-xs bg-blue-700 px-2.5 py-1 rounded-lg font-medium">Loading...</span>
                <button onclick="handleLogout()" class="text-xs bg-blue-700 hover:bg-blue-800 px-3 py-1.5 rounded-lg font-medium transition-all">Log Out</button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-4xl w-full mx-auto p-4 flex-grow space-y-6">

        <!-- STATS / QUICK OVERVIEW -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
                <p class="text-xs font-bold uppercase tracking-wider text-slate-400">Total Revenue</p>
                <p id="stat-revenue" class="text-2xl font-black text-slate-900 mt-1">R 0.00</p>
            </div>
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
                <p class="text-xs font-bold uppercase tracking-wider text-slate-400">Receipts Issued</p>
                <p id="stat-count" class="text-2xl font-black text-slate-900 mt-1">0</p>
            </div>
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
                <p class="text-xs font-bold uppercase tracking-wider text-slate-400">System Status</p>
                <p class="text-xs font-bold text-emerald-600 mt-2 flex items-center gap-1.5">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> RLS Secured
                </p>
            </div>
        </div>

        <!-- GENERATE RECEIPT CARD -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
            <h2 class="text-lg font-bold text-slate-900 mb-4">Issue New Digital Receipt</h2>
            
            <form id="receipt-form" onsubmit="handleCreateReceipt(event)" class="space-y-4">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Customer Name</label>
                        <input id="customer-name" type="text" required placeholder="e.g. John Doe" class="w-full px-3.5 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Payment Method</label>
                        <select id="payment-method" class="w-full px-3.5 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="EFT">EFT (Bank Transfer)</option>
                            <option value="Cash">Cash</option>
                            <option value="Card">Card</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Amount (ZAR)</label>
                        <input id="receipt-amount" type="number" step="0.01" required placeholder="0.00" class="w-full px-3.5 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Description / Items</label>
                        <input id="receipt-items" type="text" required placeholder="e.g. Consulting Services / Goods" class="w-full px-3.5 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>

                <div id="form-message" class="hidden p-3 rounded-xl text-xs"></div>

                <button type="submit" id="issue-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl transition-all shadow-sm">
                    Generate & Secure Receipt
                </button>
            </form>
        </div>

        <!-- RECENT RECEIPTS SECTION -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-bold text-slate-900">Recent Receipts</h2>
                <input id="search-input" type="text" onkeyup="filterReceipts()" placeholder="Search customer or ID..." class="px-3 py-1.5 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 w-48">
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-slate-100 text-[11px] font-bold uppercase tracking-wider text-slate-400">
                            <th class="py-3 px-3">Receipt ID / Hash</th>
                            <th class="py-3 px-3">Customer</th>
                            <th class="py-3 px-3">Amount</th>
                            <th class="py-3 px-3">Method</th>
                            <th class="py-3 px-3">Status</th>
                            <th class="py-3 px-3 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="receipts-table-body" class="text-xs divide-y divide-slate-100">
                        <tr>
                            <td colspan="6" class="py-6 text-center text-slate-400">Loading receipts...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="text-center py-4 text-[10px] text-slate-400">
        Slipstream &copy; 2026 &bull; Cryptographically Verified Ledger
    </footer>

    <!-- SCRIPT LOGIC -->
    <script>
        const SUPABASE_URL = 'https://pddjualtnhgmplampucn.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_31VRHyY4ze-5FqJU7CKooA_PzYUIYCH';

        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        let currentMerchant = null;
        let allReceipts = [];

        window.addEventListener('DOMContentLoaded', async () => {
            const { data: { session }, error } = await _supabase.auth.getSession();
            if (error || !session) {
                window.location.href = 'login.html';
                return;
            }
            currentUser = session.user;
            await loadMerchantProfile();
            await loadReceipts();
        });

        async function loadMerchantProfile() {
            const { data } = await _supabase
                .from('merchants')
                .select('*')
                .eq('id', currentUser.id)
                .single();

            if (data) {
                currentMerchant = data;
                document.getElementById('nav-badge').textContent = data.business_name;
            } else {
                document.getElementById('nav-badge').textContent = currentUser.email;
            }
        }

        async function loadReceipts() {
            const { data, error } = await _supabase
                .from('receipts')
                .select('*')
                .eq('merchant_id', currentUser.id)
                .order('created_at', { ascending: false });

            if (error) {
                console.error('Error loading receipts:', error);
                return;
            }

            allReceipts = data || [];
            renderReceipts(allReceipts);
            updateStats(allReceipts);
        }

        function updateStats(receipts) {
            const totalCount = receipts.length;
            const totalRev = receipts
                .filter(r => r.status !== 'cancelled' && r.status !== 'refunded')
                .reduce((sum, r) => sum + Number(r.amount), 0);

            document.getElementById('stat-count').textContent = totalCount;
            document.getElementById('stat-revenue').textContent = `R ${totalRev.toFixed(2)}`;
        }

        async function generateCryptoHash(text) {
            const msgBuffer = new TextEncoder().encode(text);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('').substring(0, 16);
        }

        async function handleCreateReceipt(event) {
            event.preventDefault();
            const btn = document.getElementById('issue-btn');
            const msgBox = document.getElementById('form-message');

            const customerName = document.getElementById('customer-name').value.trim();
            const paymentMethod = document.getElementById('payment-method').value;
            const amount = parseFloat(document.getElementById('receipt-amount').value);
            const items = document.getElementById('receipt-items').value.trim();

            btn.disabled = true;
            btn.textContent = 'Securing Receipt...';

            const rawString = `${currentUser.id}-${customerName}-${amount}-${Date.now()}`;
            const verificationHash = await generateCryptoHash(rawString);

            const { error } = await _supabase.from('receipts').insert([
                {
                    merchant_id: currentUser.id,
                    customer_name: customerName,
                    amount: amount,
                    payment_method: paymentMethod,
                    description: items,
                    verification_hash: verificationHash,
                    status: 'issued'
                }
            ]);

            if (error) {
                msgBox.textContent = error.message;
                msgBox.className = 'p-3 rounded-xl text-xs bg-red-50 text-red-600 mt-4';
                msgBox.classList.remove('hidden');
                btn.disabled = false;
                btn.textContent = 'Generate & Secure Receipt';
                return;
            }

            document.getElementById('receipt-form').reset();
            msgBox.textContent = 'Receipt generated and cryptographically secured successfully!';
            msgBox.className = 'p-3 rounded-xl text-xs bg-emerald-50 text-emerald-600 mt-4';
            msgBox.classList.remove('hidden');

            btn.disabled = false;
            btn.textContent = 'Generate & Secure Receipt';

            setTimeout(() => msgBox.classList.add('hidden'), 4000);
            await loadReceipts();
        }

        function renderReceipts(receipts) {
            const tbody = document.getElementById('receipts-table-body');
            if (receipts.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="py-6 text-center text-slate-400">No receipts found. Issue your first receipt above.</td></tr>`;
                return;
            }

            tbody.innerHTML = receipts.map(r => `
                <tr class="hover:bg-slate-50 transition-colors">
                    <td class="py-3 px-3 font-mono text-[11px] text-blue-600 font-semibold">${r.verification_hash}</td>
                    <td class="py-3 px-3 font-medium text-slate-800">${escapeHtml(r.customer_name)}</td>
                    <td class="py-3 px-3 font-bold text-slate-900">R ${Number(r.amount).toFixed(2)}</td>
                    <td class="py-3 px-3"><span class="bg-slate-100 text-slate-600 px-2 py-0.5 rounded text-[10px] font-bold uppercase">${r.payment_method}</span></td>
                    <td class="py-3 px-3"><span class="px-2 py-0.5 rounded-full text-[10px] font-bold uppercase ${getStatusBadgeClass(r.status)}">${r.status}</span></td>
                    <td class="py-3 px-3 text-right space-x-2">
                        <button onclick="viewReceipt('${r.verification_hash}')" class="text-blue-600 hover:text-blue-800 font-semibold">View</button>
                    </td>
                </tr>
            `).join('');
        }

        function getStatusBadgeClass(status) {
            switch(status) {
                case 'issued': return 'bg-emerald-50 text-emerald-600';
                case 'cancelled': return 'bg-red-50 text-red-600';
                case 'refunded': return 'bg-amber-50 text-amber-600';
                default: return 'bg-slate-100 text-slate-600';
            }
        }

        function filterReceipts() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const filtered = allReceipts.filter(r => 
                r.customer_name.toLowerCase().includes(query) || 
                r.verification_hash.toLowerCase().includes(query)
            );
            renderReceipts(filtered);
        }

        function viewReceipt(hash) {
            alert(`Viewing verification details for cryptographic hash: ${hash}`);
        }

        async function handleLogout() {
            await _supabase.auth.signOut();
            window.location.href = 'login.html';
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
