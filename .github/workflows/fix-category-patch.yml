name: ValoraTap category patch correction
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[bot]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct category wiring
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          bad='border:1px solid rgba(255, transaction_category: document.getElementById("transaction-category").value,255,255,.12)'
          good='border:1px solid rgba(255,255,255,.12)'
          if bad in s:
              s=s.replace(bad,good,1)
          if 'transaction_category: document.getElementById("transaction-category").value' not in s:
              pat=r'(from\(\s*[\'\"]receipts[\'\"]\s*\)\.insert\(\[\s*\{)'
              s,n=re.subn(pat,r'\1 transaction_category: document.getElementById("transaction-category").value,',s,count=1)
              if n==0:
                  raise SystemExit('Receipt insert call not found')
          p.write_text(s)
          PY
      - name: Validate and commit
        run: |
          grep -q 'id="transaction-category"' index.html
          grep -q 'transaction_category: document.getElementById("transaction-category").value' index.html
          ! grep -q 'rgba(255, transaction_category:' index.html
          git diff --check
          git config user.name 'ValoraTap Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/fix-category-patch.yml
          git commit -m '[bot] Correct transaction category wiring'
          git push
