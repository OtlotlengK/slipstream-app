name: Repair intelligence centres

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair CSP and activity filter handler
        shell: bash
        run: |
          set -euo pipefail
          files=(command-centre.html activity.html financial-intelligence.html customer-centre.html action-centre.html)
          for f in "${files[@]}"; do
            test -f "$f"
            python - "$f" <<'PY'
import sys
from pathlib import Path
p=Path(sys.argv[1])
s=p.read_text()
s=s.replace("script-src 'self' https://cdn.tailwindcss.com https://cdn.jsdelivr.net;", "script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://cdn.jsdelivr.net;")
s=s.replace('oninput="render"', 'oninput="render()"')
p.write_text(s)
PY
          done

          git config user.name "ValoraTap Repair Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add command-centre.html activity.html financial-intelligence.html customer-centre.html action-centre.html
          git diff --cached --quiet || git commit -m "Fix intelligence centre loading and controls"
          git push

      - name: Remove temporary repair workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/repair-centres.yml
          git config user.name "ValoraTap Repair Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/repair-centres.yml
          git commit -m "Remove temporary repair workflow"
          git push
