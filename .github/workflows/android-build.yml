name: VynoTap Android production debug build

on:
  push:
    branches:
      - feat/production-auth-android-unification
    paths:
      - '**'
      - '!README.md'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    name: Build production-connected APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out production integration branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund
      - name: Prepare production web bundle
        run: npm run build:android
      - name: Add Android platform
        run: npx cap add android
      - name: Sync Capacitor Android project
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Upload production-connected debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vynotap-android-debug-production
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
