name: Fix transaction handoff UI
on:
  push:
    paths:
      - '.github/workflows/fix-transaction-handoff.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace broken handoff with integrated receipt flow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          # Remove the previous broken handoff injection(s).
          s=re.sub(r'<style id="valoratap-transaction-handoff-styles">.*?</style>', '', s, flags=re.S)
          s=s.replace('</style></style>', '</style>')
          s=re.sub(r'<div id="vt-transaction-handoff".*?</div>\s*</div>', '', s, flags=re.S)
          s=re.sub(r'<script id="valoratap-transaction-handoff-script">.*?</script>', '', s, flags=re.S)
          css='''<style id="valoratap-transaction-handoff-v2">\n.vt-handoff-mode{background:#fff!important}.vt-handoff-card{width:100%;max-width:520px;margin:0 auto;padding:4px 2px 2px}.vt-handoff-icon{width:52px;height:52px;border-radius:16px;margin:0 auto 12px;background:#f5edda;border:1px solid #e8dcc0;color:#a47f2b;display:flex;align-items:center;justify-content:center;font-size:25px;font-weight:900}.vt-handoff-title{text-align:center;font-size:24px;line-height:1.15;font-weight:900;color:#171717}.vt-handoff-sub{text-align:center;font-size:12px;color:#64748b;margin-top:6px}.vt-handoff-flow{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:18px 0}.vt-handoff-step{text-align:center;color:#94a3b8;font-size:8px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;line-height:1.25}.vt-handoff-step:before{content:'';display:block;width:9px;height:9px;border-radius:50%;margin:0 auto 7px;background:#cbd5e1}.vt-handoff-step.done{color:#475569}.vt-handoff-step.done:before{background:#475569}.vt-handoff-step.active{color:#a47f2b}.vt-handoff-step.active:before{background:#b08d3b;box-shadow:0 0 0 4px #f5edda}.vt-handoff-summary{border:1px solid #e2e8f0;border-radius:16px;background:#fafafa;padding:13px 15px;margin-bottom:14px}.vt-handoff-row{display:flex;justify-content:space-between;gap:12px;padding:5px 0;font-size:12px}.vt-handoff-row span:first-child{color:#64748b}.vt-handoff-row span:last-child{font-weight:800;text-align:right;word-break:break-word}.vt-handoff-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.vt-handoff-btn{border:0;border-radius:13px;padding:13px 10px;font-size:12px;font-weight:800;cursor:pointer}.vt-handoff-primary{background:#b08d3b;color:#fff}.vt-handoff-dark{background:#242424;color:#fff}.vt-handoff-light{background:#f1f5f9;color:#334155}.vt-handoff-wide{grid-column:1/-1}.vt-handoff-note{text-align:center;color:#94a3b8;font-size:10px;margin-top:13px}@media(max-width:520px){.vt-handoff-card{padding:0}.vt-handoff-title{font-size:21px}.vt-handoff-actions{grid-template-columns:1fr}.vt-handoff-wide{grid-column:auto}.vt-handoff-flow{margin:16px 0}.vt-handoff-step{font-size:7px}}\n</style>'''
          js='''<script id="valoratap-transaction-handoff-v2-script">\n(function(){\n  function ready(fn){if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',fn);else fn()}\n  ready(function(){\n    const form=document.getElementById('receipt-form'), modal=document.getElementById('receipt-modal'), category=document.getElementById('transaction-category');\n    if(!form||!modal)return;\n    let pending=false,lastCategory='other',originalHtml=null,lastId=null,lastVerificationUrl='';\n    const labels={physical_goods:'Physical product',professional_service:'Professional service',digital_product:'Digital product',appointment:'Appointment / session',delivery:'Delivery',subscription:'Subscription',rental:'Rental',other:'Other'};\n    function verificationUrl(){\n      const input=document.getElementById('verification-url');\n      if(input&&input.value)return input.value;\n      const a=[...modal.querySelectorAll('a[href]')].find(x=>/verify\.html/i.test(x.href));\n      return a?a.href:'';\n    }\n    function receiptId(url){try{return new URL(url,location.href).searchParams.get('id')}catch(e){return null}}\n    function findValue(text,patterns){for(const p of patterns){const m=text.match(p);if(m&&m[1])return m[1].trim()}return '—'}\n    function openHandoff(){\n      const url=verificationUrl(); lastVerificationUrl=url; lastId=receiptId(url);\n      const text=modal.innerText||'';\n      const receipt=findValue(text,[/Receipt(?:\\s+Number)?\\s*[:#-]?\\s*([^\\n]+)/i]);\n      const amount=findValue(text,[/Amount\\s*[:#-]?\\s*(R?\\s*[0-9][^\\n]*)/i]);\n      if(originalHtml===null)originalHtml=modal.innerHTML;\n      modal.classList.add('vt-handoff-mode');\n      modal.innerHTML=`<div class="bg-white rounded-2xl shadow-xl max-w-lg w-full p-6 space-y-4 my-8"><div class="vt-handoff-card"><div class="vt-handoff-icon">✓</div><div class="vt-handoff-title">Transaction secured</div><div class="vt-handoff-sub">Your receipt is issued. Continue the transaction from one place.</div><div class="vt-handoff-flow"><div class="vt-handoff-step done">Receipt issued</div><div class="vt-handoff-step active">Customer receipt</div><div class="vt-handoff-step">Passport</div><div class="vt-handoff-step">Evidence Pack</div></div><div class="vt-handoff-summary"><div class="vt-handoff-row"><span>Receipt</span><span>${escapeHtml(receipt)}</span></div><div class="vt-handoff-row"><span>Amount</span><span>${escapeHtml(amount)}</span></div><div class="vt-handoff-row"><span>Transaction type</span><span>${escapeHtml(labels[lastCategory]||'Other')}</span></div></div><div class="vt-handoff-actions"><button type="button" data-vt-action="customer" class="vt-handoff-btn vt-handoff-primary">Send to Customer</button><button type="button" data-vt-action="passport" class="vt-handoff-btn vt-handoff-dark">Open Transaction Passport</button><button type="button" data-vt-action="evidence" class="vt-handoff-btn vt-handoff-dark">Generate Evidence Pack</button><button type="button" data-vt-action="receipt" class="vt-handoff-btn vt-handoff-light">View Full Receipt</button><button type="button" data-vt-action="vault" class="vt-handoff-btn vt-handoff-light vt-handoff-wide">Back to Receipt Vault</button></div><div class="vt-handoff-note">One transaction. One verification trail.</div></div></div>`;\n    }\n    function escapeHtml(v){return String(v||'—').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}\n    function restoreReceipt(){if(originalHtml!==null){modal.innerHTML=originalHtml;modal.classList.remove('vt-handoff-mode')}}\n    function go(page){if(!lastId)return;location.href=page+'?id='+encodeURIComponent(lastId)}\n    async function sendCustomer(){\n      const url=lastVerificationUrl || verificationUrl();\n      if(!url)return;\n      const shareData={title:'ValoraTap Digital Receipt',text:'Your verified ValoraTap receipt is ready.',url:url};\n      if(navigator.share){try{await navigator.share(shareData);return}catch(e){if(e&&e.name==='AbortError')return}}\n      const wa='https://wa.me/?text='+encodeURIComponent('Your verified ValoraTap receipt is ready: '+url);\n      window.open(wa,'_blank','noopener,noreferrer');\n    }\n    form.addEventListener('submit',function(){pending=true;lastCategory=category?category.value:'other'},true);\n    new MutationObserver(function(){if(pending&&!modal.classList.contains('hidden')){pending=false;setTimeout(openHandoff,60)}}).observe(modal,{attributes:true,attributeFilter:['class']});\n    modal.addEventListener('click',function(e){const b=e.target.closest('[data-vt-action]');if(!b)return;const a=b.getAttribute('data-vt-action');if(a==='customer')sendCustomer();else if(a==='passport')go('passport.html');else if(a==='evidence')go('evidence.html');else if(a==='receipt')restoreReceipt();else if(a==='vault')location.href='receipts.html'})\n  });\n})();\n</script>'''
          s=s.replace('</head>',css+'</head>',1)
          s=s.replace('</body>',js+'</body>',1)
          p.write_text(s)
          PY
      - name: Commit and remove temporary workflow
        run: |
          rm -f .github/workflows/fix-transaction-handoff.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/fix-transaction-handoff.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: integrate transaction handoff into receipt modal"
          git push
