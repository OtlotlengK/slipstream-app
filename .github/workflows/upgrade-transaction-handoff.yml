name: Upgrade transaction handoff
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upgrade post-creation transaction handoff
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          css='''\n<style id="valoratap-transaction-handoff-styles">\n.vt-handoff-backdrop{position:fixed;inset:0;background:rgba(15,15,15,.72);backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;padding:16px;z-index:70}.vt-handoff-backdrop.show{display:flex}.vt-handoff{width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;background:#fff;border-radius:24px;box-shadow:0 25px 80px rgba(0,0,0,.35);padding:24px}.vt-handoff-top{text-align:center}.vt-handoff-check{width:56px;height:56px;border-radius:18px;margin:0 auto 12px;background:#f5edda;border:1px solid #e8dcc0;color:#a47f2b;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900}.vt-handoff-title{font-size:24px;font-weight:900;color:#171717}.vt-handoff-sub{font-size:12px;color:#64748b;margin-top:5px}.vt-handoff-meta{margin-top:18px;padding:14px;border:1px solid #e2e8f0;border-radius:16px;background:#fafafa}.vt-handoff-meta-row{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:12px}.vt-handoff-meta-row span:first-child{color:#64748b}.vt-handoff-meta-row span:last-child{font-weight:800;text-align:right;word-break:break-word}.vt-flow{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:18px 0}.vt-flow-step{position:relative;text-align:center;padding:9px 4px 0;color:#94a3b8;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.05em}.vt-flow-step:before{content:'';display:block;width:10px;height:10px;border-radius:50%;margin:0 auto 7px;background:#cbd5e1}.vt-flow-step.active{color:#a47f2b}.vt-flow-step.active:before{background:#b08d3b;box-shadow:0 0 0 4px #f5edda}.vt-flow-step.done{color:#475569}.vt-flow-step.done:before{background:#475569}.vt-handoff-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.vt-handoff-btn{border:0;border-radius:13px;padding:13px 10px;font-size:12px;font-weight:800;cursor:pointer}.vt-handoff-primary{background:#b08d3b;color:#fff}.vt-handoff-dark{background:#242424;color:#fff}.vt-handoff-light{background:#f1f5f9;color:#334155}.vt-handoff-wide{grid-column:1/-1}.vt-handoff-note{text-align:center;color:#94a3b8;font-size:10px;margin-top:13px}@media(max-width:520px){.vt-handoff{padding:20px;border-radius:20px}.vt-handoff-title{font-size:21px}.vt-handoff-actions{grid-template-columns:1fr}.vt-handoff-wide{grid-column:auto}.vt-flow-step{font-size:8px}}\n</style>'''
          html='''\n<div id="vt-transaction-handoff" class="vt-handoff-backdrop" role="dialog" aria-modal="true" aria-labelledby="vt-handoff-title">\n  <div class="vt-handoff">\n    <div class="vt-handoff-top">\n      <div class="vt-handoff-check">✓</div>\n      <div id="vt-handoff-title" class="vt-handoff-title">Transaction secured</div>\n      <div class="vt-handoff-sub">The receipt is issued and ready for the next step.</div>\n    </div>\n    <div class="vt-flow">\n      <div class="vt-flow-step done">Receipt issued</div>\n      <div class="vt-flow-step active">Customer receipt</div>\n      <div class="vt-flow-step">Passport</div>\n      <div class="vt-flow-step">Evidence Pack</div>\n    </div>\n    <div class="vt-handoff-meta">\n      <div class="vt-handoff-meta-row"><span>Receipt</span><span id="vt-handoff-receipt">—</span></div>\n      <div class="vt-handoff-meta-row"><span>Amount</span><span id="vt-handoff-amount">—</span></div>\n      <div class="vt-handoff-meta-row"><span>Transaction type</span><span id="vt-handoff-category">—</span></div>\n    </div>\n    <div class="vt-handoff-actions" style="margin-top:14px">\n      <button id="vt-handoff-customer" class="vt-handoff-btn vt-handoff-primary">Send to Customer</button>\n      <button id="vt-handoff-passport" class="vt-handoff-btn vt-handoff-dark">Open Transaction Passport</button>\n      <button id="vt-handoff-evidence" class="vt-handoff-btn vt-handoff-dark">Generate Evidence Pack</button>\n      <button id="vt-handoff-receipt" class="vt-handoff-btn vt-handoff-light">View Full Receipt</button>\n      <button id="vt-handoff-vault" class="vt-handoff-btn vt-handoff-light vt-handoff-wide">Back to Receipt Vault</button>\n    </div>\n    <div class="vt-handoff-note">One transaction. One verification trail. Continue whenever you're ready.</div>\n  </div>\n</div>'''
          js='''\n<script id="valoratap-transaction-handoff-script">\n(function(){\n  let pending=false,lastId=null;\n  const categoryLabels={physical_goods:'Physical product',professional_service:'Professional service',digital_product:'Digital product',appointment:'Appointment / session',delivery:'Delivery',subscription:'Subscription',rental:'Rental',other:'Other'};\n  function idFromUrl(){const u=document.getElementById('verification-url');if(!u||!u.value)return null;try{const x=new URL(u.value,location.href);return x.searchParams.get('id')}catch(e){return null}}\n  function text(id){const e=document.getElementById(id);return e?e.textContent.trim():''}\n  function show(){\n    const id=idFromUrl(); if(!id)return; lastId=id;\n    const modal=document.getElementById('receipt-modal');\n    const category=text('modal-category')||text('transaction-category')||'Other';\n    document.getElementById('vt-handoff-receipt').textContent=text('modal-receipt-number')||id.slice(0,8).toUpperCase();\n    document.getElementById('vt-handoff-amount').textContent=text('modal-amount')||'—';\n    document.getElementById('vt-handoff-category').textContent=categoryLabels[category]||category||'Other';\n    document.getElementById('vt-transaction-handoff').classList.add('show');\n    if(modal)modal.classList.add('hidden');\n  }\n  function close(){document.getElementById('vt-transaction-handoff').classList.remove('show');const m=document.getElementById('receipt-modal');if(m)m.classList.remove('hidden')}\n  function go(page){if(lastId)location.href=page+'?id='+encodeURIComponent(lastId)}\n  document.addEventListener('submit',function(e){if(e.target&&e.target.id==='receipt-form'){pending=true}},true);\n  document.addEventListener('click',function(e){\n    if(e.target.closest('#vt-handoff-customer')){\n      close();setTimeout(function(){const b=document.querySelector('#share-whatsapp,[onclick*="shareWhatsApp"]');if(b)b.click();else if(typeof shareWhatsApp==='function')shareWhatsApp()},50);\n    }\n    if(e.target.closest('#vt-handoff-passport'))go('passport.html');\n    if(e.target.closest('#vt-handoff-evidence'))go('evidence.html');\n    if(e.target.closest('#vt-handoff-receipt'))close();\n    if(e.target.closest('#vt-handoff-vault'))location.href='receipts.html';\n  });\n  const m=document.getElementById('receipt-modal');\n  if(m){new MutationObserver(function(){if(pending&&!m.classList.contains('hidden')){pending=false;setTimeout(show,80)}}).observe(m,{attributes:true,attributeFilter:['class']})}\n})();\n</script>'''
          if 'id="valoratap-transaction-handoff-styles"' not in s:
              s=s.replace('</style>',css+'</style>',1)
          if 'id="vt-transaction-handoff"' not in s:
              s=s.replace('</body>',html+'</body>',1)
          if 'id="valoratap-transaction-handoff-script"' not in s:
              i=s.rfind('</script>')
              if i<0: raise SystemExit('No closing script tag found')
              s=s[:i]+js+s[i:]
          p.write_text(s)
          PY
      - name: Commit upgrade and remove temporary workflow
        run: |
          rm -f .github/workflows/upgrade-transaction-handoff.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/upgrade-transaction-handoff.yml
          git diff --cached --quiet && exit 0
          git commit -m "feat: add seamless transaction secured handoff"
          git push
