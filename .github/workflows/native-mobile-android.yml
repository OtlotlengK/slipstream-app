name: VynoTap native Android build

on:
  push:
    branches:
      - feat/native-mobile-expo-foundation
    paths:
      - "apps/mobile/**"
      - ".github/workflows/native-mobile-android.yml"
  pull_request:
    branches:
      - main
    paths:
      - "apps/mobile/**"
      - ".github/workflows/native-mobile-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Build native Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check Expo dependency compatibility
        run: npx expo install --check
      - name: Check TypeScript
        run: npm run typecheck
      - name: Generate native Android project
        run: npx expo prebuild --platform android --non-interactive
      - name: Build debug APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug
      - name: Upload native APK and lockfile
        uses: actions/upload-artifact@v4
        with:
          name: vynotap-native-android-debug
          path: |
            apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
            apps/mobile/package-lock.json
          if-no-files-found: error
          retention-days: 14
