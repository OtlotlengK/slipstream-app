name: ValoraTap category form patch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[bot]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch receipt creation category
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          original=s
          select='''<div><label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Transaction Category</label><select id="transaction-category" required class="w-full px-3.5 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl"><option value="physical_goods">Physical product</option><option value="professional_service">Professional service</option><option value="digital_product">Digital product</option><option value="appointment">Appointment / session</option><option value="delivery">Delivery</option><option value="subscription">Subscription</option><option value="rental">Rental</option><option value="other">Other</option></select></div>'''
          marker='<div><label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Description / Items</label>'
          if 'id="transaction-category"' not in s:
              if marker not in s: raise SystemExit('Description marker not found')
              s=s.replace(marker, select+marker, 1)
          if 'transaction_category:' not in s:
              patterns=[
                (r'(\bitems\s*:\s*document\.getElementById\(["\']receipt-items["\']\)\.value\s*,)', r'\1 transaction_category: document.getElementById("transaction-category").value,'),
                (r'(\bitems\s*:\s*[^,\n}]+,)', r'\1 transaction_category: document.getElementById("transaction-category").value,'),
                (r'(\bdescription\s*:\s*[^,\n}]+,)', r'\1 transaction_category: document.getElementById("transaction-category").value,'),
              ]
              for pat,repl in patterns:
                  ns,n=re.subn(pat,repl,s,count=1)
                  if n:
                      s=ns; break
              else:
                  raise SystemExit('Could not locate receipt insert payload')
          if s==original: raise SystemExit('No changes made')
          p.write_text(s)
          PY
      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name 'ValoraTap Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git diff --cached --check
          git rm .github/workflows/patch-category-form.yml
          git commit -m '[bot] Add transaction category to receipt creation'
          git push
