<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="application-name" content="VynoTap"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Vyno"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#2B2A6B"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icons/vynotap.svg" type="image/svg+xml">
<title>VynoTap | Business Setup</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/vt-env.js"></script><script src="/core/services/supabase-client.js"></script>
<script src="/app-lock.js" defer></script>
</head>
<body class="bg-[#0F172A] min-h-screen text-slate-100 flex items-center justify-center p-4">
<div class="w-full max-w-lg">
  <div class="text-center mb-7">
    <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-[#6C4CF1]/10 border border-[#6C4CF1]/30 mb-3"><img src="/icons/vynotap.svg" alt="VynoTap" class="w-12 h-12 object-contain"></div>
    <h1 class="text-3xl font-black tracking-[0.12em] text-white">VYNOTAP</h1>
    <p class="text-sm text-slate-400 mt-1">Set up your business profile</p>
  </div>
  <div class="bg-[#111827] rounded-2xl shadow-2xl border border-slate-800 p-6">
    <div class="mb-6">
      <p class="text-xs font-bold uppercase tracking-wider text-[#d8b84c]">Merchant onboarding</p>
      <h2 class="text-xl font-bold mt-1">Tell us about your business</h2>
      <p class="text-xs text-slate-400 mt-1">These details appear on your VynoTap merchant account and can be updated later.</p>
    </div>
    <div class="space-y-4">
      <div><label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">Business Name</label><input id="business-name" type="text" required autocomplete="organization" class="w-full px-3.5 py-3 text-sm bg-[#0d1014] border border-slate-700 text-white rounded-xl focus:outline-none focus:ring-2 focus:ring-[#6C4CF1]"></div>
      <div><label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">Owner / Contact Name</label><input id="owner-name" type="text" autocomplete="name" class="w-full px-3.5 py-3 text-sm bg-[#0d1014] border border-slate-700 text-white rounded-xl focus:outline-none focus:ring-2 focus:ring-[#6C4CF1]"></div>
      <div><label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">Business Phone</label><input id="phone" type="tel" autocomplete="tel" placeholder="e.g. +27 71 234 5678" class="w-full px-3.5 py-3 text-sm bg-[#0d1014] border border-slate-700 text-white rounded-xl focus:outline-none focus:ring-2 focus:ring-[#c9a227]"></div>
    </div>
    <div id="message" role="status" aria-live="polite" class="hidden mt-4 p-3 rounded-xl text-xs"></div>
    <button id="save-btn" type="button" onclick="saveProfile()" class="w-full mt-5 bg-[#c9a227] hover:bg-[#8B7CF6] text-[#0b0d10] font-bold py-3 rounded-xl">Create Business Profile</button>
  </div>
  <p class="text-center text-[10px] text-slate-600 mt-5">VynoTap © 2026</p>
</div>
<script>
const db=window.VT.createSupabaseClient();
let user=null;
let profileReady=false;
const $=id=>document.getElementById(id);
function msg(text,error=false){const el=$('message');el.textContent=text;el.className='mt-4 p-3 rounded-xl text-xs '+(error?'bg-red-950/50 text-red-300':'bg-emerald-950/50 text-emerald-300');el.classList.remove('hidden');}
async function init(){
  const{data:{session},error:sessionError}=await db.auth.getSession();
  if(sessionError){msg('We could not verify your session. Please sign in again.',true);return;}
  if(!session){location.href='/login.html';return;}
  user=session.user;
  const{data,error}=await db.from('merchants').select('business_name,owner_name,phone').eq('id',user.id).maybeSingle();
  if(error){msg('We could not load your merchant profile. '+error.message,true);return;}
  if(data){
    $('business-name').value=data.business_name||'';
    $('owner-name').value=data.owner_name||'';
    $('phone').value=data.phone||'';
    $('save-btn').textContent='Save & Continue';
  }else{
    const metadata=user.user_metadata||{};
    $('business-name').value=metadata.business_name||'';
    $('owner-name').value=metadata.owner_name||'';
    $('save-btn').textContent='Create Business Profile';
  }
  profileReady=true;
}
async function saveProfile(){
  if(!user||!profileReady){msg('Your session or profile is not ready. Refresh and try again.',true);return;}
  const business_name=$('business-name').value.trim();
  const owner_name=$('owner-name').value.trim();
  const phone=$('phone').value.trim();
  if(!business_name){msg('Business name is required.',true);$('business-name').focus();return;}
  const btn=$('save-btn');btn.disabled=true;btn.textContent='Saving...';
  try{
    const{data:existing,error:lookupError}=await db.from('merchants').select('id').eq('id',user.id).maybeSingle();
    if(lookupError)throw lookupError;
    const payload={business_name,owner_name:owner_name||null,phone:phone||null};
    let result;
    if(existing){
      result=await db.from('merchants').update(payload).eq('id',user.id).select('id').single();
    }else{
      result=await db.from('merchants').insert({id:user.id,...payload}).select('id').single();
    }
    if(result.error)throw result.error;
    if(!result.data?.id)throw new Error('The merchant profile could not be confirmed after saving.');
    btn.textContent='Saved — opening dashboard...';
    window.location.replace('/index.html');
  }catch(error){
    console.error('VynoTap merchant onboarding failed:',error);
    msg(error.message||'We could not save your business profile. Please try again.',true);
    btn.disabled=false;btn.textContent='Try Again';
  }
}
window.addEventListener('DOMContentLoaded',init);
</script>
</body>
</html>
