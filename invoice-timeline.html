<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'self';script-src 'self' https://cdn.jsdelivr.net;connect-src 'self' https://pddjualtnhgmplampucn.supabase.co;style-src 'self' 'unsafe-inline';base-uri 'none';form-action 'self';frame-ancestors 'none'"><title>ValoraTap | Payment Timeline</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--gold:#d0aa4b;--paper:#f5f2eb;--ink:#171717;--line:#e4ded2}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif}.top{background:#171717;color:#fff}.topin,.wrap{max-width:1000px;margin:auto}.topin{padding:16px 18px;display:flex;justify-content:space-between;align-items:center}.wrap{padding:34px 18px 60px}.brand{font-weight:950;letter-spacing:.16em;color:#fff;text-decoration:none}.btn{border:0;border-radius:11px;padding:11px 14px;font-size:11px;font-weight:900;text-decoration:none;cursor:pointer}.ghost{background:#fff;color:#171717}.card{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 3px 14px rgba(25,20,10,.04)}.pad{padding:24px}.label{font-size:9px;font-weight:950;letter-spacing:.14em;text-transform:uppercase;color:#8d867a}.gold{color:var(--gold)}h1{font-size:34px;line-height:1.05;margin:7px 0}.muted{color:#777;font-size:12px}.timeline{margin-top:24px}.event{display:grid;grid-template-columns:28px 1fr;gap:15px;padding:0 0 24px;position:relative}.event:last-child{padding-bottom:0}.dot{width:12px;height:12px;border-radius:50%;background:var(--gold);margin-top:5px;position:relative;z-index:2}.event:not(:last-child) .dot:after{content:'';position:absolute;width:1px;height:calc(100% + 24px);left:5px;top:12px;background:#ddd5c5}.name{font-weight:950;font-size:13px}.time{font-size:10px;color:#999;margin-top:4px}.meta{margin-top:7px;background:#faf8f3;border:1px solid #eeeae2;border-radius:10px;padding:8px;font-size:10px;color:#666;word-break:break-word}.empty{padding:35px;text-align:center;color:#777}.error{background:#fff0ef;border:1px solid #efc3be;color:#9d342c;padding:14px;border-radius:12px;font-size:12px}.hidden{display:none!important}@media(max-width:600px){h1{font-size:28px}.pad{padding:18px}}</style></head><body><header class="top"><div class="topin"><a class="brand" href="index.html">VALORATAP</a><div style="display:flex;gap:8px"><a class="btn ghost" href="invoice-centre.html">Invoice Centre</a><button class="btn" style="background:#242424;color:#fff" onclick="logout()">Log out</button></div></div></header><main class="wrap"><div style="margin-bottom:20px"><div class="label gold">Payment intelligence</div><h1>Invoice payment timeline</h1><div class="muted">A chronological audit trail of the invoice from creation through payment confirmation and receipt issuance.</div></div><div id="error" class="error hidden"></div><section id="content" class="card pad hidden"><div style="display:flex;justify-content:space-between;gap:15px;align-items:flex-start;flex-wrap:wrap"><div><div class="label">Invoice</div><div id="invoiceNo" style="font-size:21px;font-weight:950;margin-top:5px">—</div><div id="client" class="muted" style="margin-top:4px">—</div></div><a id="open" class="btn ghost" href="#">Open Invoice</a></div><div id="timeline" class="timeline"></div></section></main><script>const URL='https://pddjualtnhgmplampucn.supabase.co',KEY='sb_publishable_31VRHyY4ze-5FqJU7CKooA_PzYUIYCH',db=supabase.createClient(URL,KEY),id=new URLSearchParams(location.search).get('id');const labels={INVOICE_CREATED:'Invoice created',INVOICE_SENT:'Invoice sent',INVOICE_VIEWED:'Invoice viewed',PAYMENT_SUBMITTED:'Proof of payment submitted',PAYMENT_CONFIRMED:'Payment confirmed',PAYMENT_REJECTED:'Payment rejected',RECEIPT_ISSUED:'Receipt issued'};function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function showError(t){const e=document.querySelector('#error');e.textContent=t;e.classList.remove('hidden')}async function init(){const{data:{session}}=await db.auth.getSession();if(!session){location.href='login.html';return}if(!/^[0-9a-f-]{36}$/i.test(id||'')){showError('Invalid invoice reference.');return}const{data:inv,error:ie}=await db.from('invoices').select('id,invoice_no,customer_name').eq('id',id).eq('merchant_id',session.user.id).maybeSingle();if(ie||!inv){showError('Invoice not found or access denied.');return}const{data,error}=await db.rpc('get_invoice_timeline',{p_invoice_id:id});if(error){showError('Unable to load payment timeline.');return}document.querySelector('#content').classList.remove('hidden');document.querySelector('#invoiceNo').textContent=inv.invoice_no||'Invoice';document.querySelector('#client').textContent=inv.customer_name||'';document.querySelector('#open').href='invoice-preview.html?id='+encodeURIComponent(id);const events=data||[];document.querySelector('#timeline').innerHTML=events.length?events.map(e=>`<div class="event"><div class="dot"></div><div><div class="name">${esc(labels[e.event_type]||e.event_type)}</div><div class="time">${new Date(e.created_at).toLocaleString('en-ZA')} · ${esc(e.actor_type)}</div>${e.metadata&&Object.keys(e.metadata).length?`<div class="meta">${esc(JSON.stringify(e.metadata))}</div>`:''}</div></div>`).join(''):'<div class="empty">No timeline events recorded yet.</div>'}async function logout(){await db.auth.signOut();location.href='login.html'}init();</script></body></html>
