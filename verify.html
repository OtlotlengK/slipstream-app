<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slipstream | Verify Receipt</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4 font-sans text-slate-800">
<main class="max-w-md w-full bg-white rounded-3xl shadow-lg border border-slate-200 p-7 space-y-5">
<div class="text-center">
<div id="status-icon" class="w-16 h-16 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center mx-auto text-2xl font-bold">🔍</div>
<h1 class="font-black text-2xl mt-3">Slipstream Verification</h1>
<p id="status-subtitle" class="text-xs text-slate-400 uppercase tracking-widest font-semibold mt-1">Checking receipt...</p>
</div>

<div id="receipt-card" class="hidden space-y-3 bg-slate-50 p-5 rounded-2xl border border-slate-200 text-xs">
<div class="flex justify-between border-b border-slate-200 pb-2"><span class="text-slate-400">Business</span><strong id="business"></strong></div>
<div class="flex justify-between border-b border-slate-200 pb-2"><span class="text-slate-400">Receipt</span><strong id="receipt-no"></strong></div>
<div class="flex justify-between border-b border-slate-200 pb-2"><span class="text-slate-400">Customer</span><strong id="customer"></strong></div>
<div class="flex justify-between border-b border-slate-200 pb-2"><span class="text-slate-400">Amount</span><strong id="amount"></strong></div>
<div class="flex justify-between border-b border-slate-200 pb-2"><span class="text-slate-400">Payment Method</span><strong id="method"></strong></div>
<div class="flex justify-between border-b border-slate-200 pb-2"><span class="text-slate-400">Description</span><strong id="description" class="text-right max-w-[60%]"></strong></div>
<div class="flex justify-between border-b border-slate-200 pb-2"><span class="text-slate-400">Date Issued</span><strong id="date"></strong></div>
<div><span class="text-[10px] font-bold uppercase tracking-wider text-slate-400">Verification Hash</span><p id="hash" class="font-mono text-[11px] break-all text-blue-600 mt-1"></p></div>
</div>

<div id="verification-tools" class="hidden space-y-3">
<div class="bg-white border border-slate-200 rounded-2xl p-4">
<div class="text-center">
<p class="text-[10px] text-slate-400 uppercase tracking-widest font-bold mb-3">Scan to Verify</p>
<div id="qrcode" class="w-[180px] h-[180px] mx-auto flex items-center justify-center"></div>
<p class="text-[9px] text-slate-400 mt-3 break-all" id="verification-url"></p>
</div>
<div class="grid grid-cols-2 gap-2 mt-4">
<button onclick="copyVerificationLink()" class="bg-slate-800 hover:bg-slate-900 text-white font-semibold py-2.5 rounded-xl text-xs">Copy Link</button>
<button onclick="shareVerification()" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-xl text-xs">Share</button>
</div>
</div>
</div>

<div id="error-box" class="hidden bg-red-50 border border-red-200 text-red-700 p-4 rounded-2xl text-xs text-center font-medium">Receipt not found or the verification link is invalid.</div>
<p class="text-center text-[10px] text-slate-400 uppercase tracking-widest font-semibold">Secured by Slipstream Protocol</p>
</main>
<script>
const SUPABASE_URL='https://pddjualtnhgmplampucn.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_31VRHyY4ze-5FqJU7CKooA_PzYUIYCH';
const {createClient}=supabase;
const db=createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
let verificationUrl='';

async function verify(){
 const id=new URLSearchParams(location.search).get('id');
 if(!id){return fail();}
 const {data,error}=await db.rpc('verify_receipt',{p_receipt_id:id});
 if(error||!data||!data.length){return fail();}
 const r=data[0];
 document.getElementById('business').textContent=r.business_name||'Verified Merchant';
 document.getElementById('receipt-no').textContent=r.receipt_no||'—';
 document.getElementById('customer').textContent=r.customer_name||'—';
 document.getElementById('amount').textContent=`R ${Number(r.amount||0).toFixed(2)}`;
 document.getElementById('method').textContent=r.payment_method||'—';
 document.getElementById('description').textContent=r.description||'—';
 document.getElementById('date').textContent=r.created_at?new Date(r.created_at).toLocaleString():'—';
 document.getElementById('hash').textContent=r.verification_hash||'—';
 document.getElementById('receipt-card').classList.remove('hidden');

 verificationUrl=window.location.href;
 document.getElementById('verification-url').textContent=verificationUrl;
 const qr=document.getElementById('qrcode');
 qr.innerHTML='';
 new QRCode(qr,{text:verificationUrl,width:180,height:180,colorDark:'#0f172a',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});
 document.getElementById('verification-tools').classList.remove('hidden');

 const icon=document.getElementById('status-icon'), sub=document.getElementById('status-subtitle');
 if(r.status==='cancelled'||r.status==='refunded'){
   icon.textContent='!';
   icon.className='w-16 h-16 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center mx-auto text-2xl font-black';
   sub.textContent=`Receipt ${r.status.toUpperCase()}`;
   sub.className='text-xs text-amber-600 uppercase tracking-widest font-bold mt-1';
 } else {
   icon.textContent='✓';
   icon.className='w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto text-2xl font-black';
   sub.textContent='Authentic Slipstream Receipt';
   sub.className='text-xs text-emerald-600 uppercase tracking-widest font-bold mt-1';
 }
}

async function copyVerificationLink(){
 if(!verificationUrl)return;
 try{
   await navigator.clipboard.writeText(verificationUrl);
   const btn=event.currentTarget;
   const old=btn.textContent;
   btn.textContent='Copied ✓';
   setTimeout(()=>btn.textContent=old,1800);
 }catch(e){
   window.prompt('Copy this verification link:',verificationUrl);
 }
}

async function shareVerification(){
 if(!verificationUrl)return;
 const text='Verify this Slipstream digital receipt: '+verificationUrl;
 if(navigator.share){
   try{await navigator.share({title:'Slipstream Receipt Verification',text,url:verificationUrl});}catch(e){}
 }else{
   window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank');
 }
}

function fail(){
 document.getElementById('status-icon').textContent='⚠';
 document.getElementById('status-icon').className='w-16 h-16 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto text-2xl font-black';
 document.getElementById('status-subtitle').textContent='Verification Failed';
 document.getElementById('status-subtitle').className='text-xs text-red-600 uppercase tracking-widest font-bold mt-1';
 document.getElementById('error-box').classList.remove('hidden');
}
verify();
</script>
</body>
</html>
