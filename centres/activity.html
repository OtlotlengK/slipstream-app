<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta http-equiv="Cache-Control" content="no-store"><meta http-equiv="Content-Security-Policy" content="default-src 'self';script-src 'self' https://cdn.tailwindcss.com https://cdn.jsdelivr.net;connect-src 'self' https://pddjualtnhgmplampucn.supabase.co;style-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com;base-uri 'none';form-action 'self';frame-ancestors 'none';object-src 'none'"><title>ValoraTap | Activity Centre</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{background:#f4f2ed}.muted{color:#8b877f}.box{border:1px solid #e7e2d8;border-radius:18px;padding:16px;background:#fff}</style></head><body data-centre="activity" class="min-h-screen text-slate-800"><main class="max-w-7xl mx-auto px-4 sm:px-6 py-6 space-y-5"><header><a href="dashboard-v2.html" class="font-black tracking-[.18em]">VALORATAP</a><h1 class="text-3xl font-black mt-4">Activity Centre</h1><p class="text-sm text-slate-500">Receipts, invoices, online payments and crypto activity in one merchant-scoped view.</p></header><section class="grid grid-cols-2 lg:grid-cols-5 gap-3"><div class="box"><small>Receipts</small><div id="receiptCount" class="text-2xl font-black">—</div></div><div class="box"><small>Invoices</small><div id="invoiceCount" class="text-2xl font-black">—</div></div><div class="box"><small>Online payments</small><div id="paymentCount" class="text-2xl font-black">—</div></div><div class="box"><small>Crypto</small><div id="cryptoCount" class="text-2xl font-black">—</div></div><div class="box"><small>Receipt revenue</small><div id="revenue" class="text-2xl font-black">R 0.00</div></div></section><section class="box flex flex-col lg:flex-row gap-3"><input id="q" type="search" placeholder="Search activity…" class="flex-1 px-4 py-3 bg-slate-50 rounded-xl"><select id="type" class="px-4 py-3 bg-slate-50 rounded-xl"><option value="">All activity</option><option value="receipt">Receipts</option><option value="invoice">Invoices</option><option value="payment">Online payments</option><option value="crypto">Crypto</option></select><select id="status" class="px-4 py-3 bg-slate-50 rounded-xl"><option value="">All statuses</option><option value="completed">Completed / paid</option><option value="pending">Pending</option><option value="exception">Exceptions</option></select></section><section class="box overflow-auto"><div class="text-xs muted mb-4" id="updated">Loading activity…</div><table class="w-full text-left"><thead><tr class="border-b text-xs text-slate-400"><th class="p-3">Type</th><th class="p-3">Reference / customer</th><th class="p-3">Status</th><th class="p-3">Amount</th><th class="p-3">Date</th><th class="p-3 text-right">Open</th></tr></thead><tbody id="rows"></tbody></table><div id="cards" class="md:hidden space-y-3 mt-3"></div><div id="empty" hidden class="py-12 text-center muted">No activity matches your filters.</div></section><section id="error" hidden class="box text-sm text-red-600"></section></main><script src="/centres/centre.js"></script></body></html>
