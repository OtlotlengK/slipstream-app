<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta http-equiv="Cache-Control" content="no-store"><meta http-equiv="Content-Security-Policy" content="default-src 'self';script-src 'self' https://cdn.tailwindcss.com https://cdn.jsdelivr.net;connect-src 'self' https://pddjualtnhgmplampucn.supabase.co;style-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com;base-uri 'none';form-action 'self';frame-ancestors 'none';object-src 'none'"><title>ValoraTap | Financial Intelligence</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{background:#f5f3ee}.box{border:1px solid #e7e2d8;border-radius:18px;padding:16px;background:#fff}.bar{height:9px;border-radius:99px;background:#eeeae2;overflow:hidden}.bar i{display:block;height:100%;background:#b08d3b}</style></head><body data-centre="financial" class="min-h-screen text-slate-800"><main class="max-w-7xl mx-auto px-4 sm:px-6 py-6 space-y-5"><header class="bg-[#171717] text-white rounded-3xl p-6"><div class="text-[10px] uppercase tracking-widest text-[#d8b84c] font-black">Financial intelligence</div><h1 class="text-3xl font-black mt-2">Turn transactions into business signals.</h1><p id="welcome" class="text-sm text-slate-400 mt-2">Loading your financial picture…</p></header><section class="grid grid-cols-2 lg:grid-cols-5 gap-3"><div class="box"><small>30-day receipts</small><div id="revenue30" class="text-2xl font-black mt-2">R 0.00</div><small id="receipt30">—</small></div><div class="box"><small>Average receipt</small><div id="avg" class="text-2xl font-black mt-2">R 0.00</div></div><div class="box"><small>Paid invoices</small><div id="paidInv" class="text-2xl font-black mt-2">—</div></div><div class="box"><small>Outstanding</small><div id="openInv" class="text-2xl font-black mt-2">R 0.00</div><small id="openCount">—</small></div><div class="box"><small>Exceptions</small><div id="exceptions" class="text-2xl font-black mt-2">—</div></div></section><section class="grid lg:grid-cols-2 gap-5"><div class="box"><h2 class="text-xl font-black">Receipt momentum</h2><div id="days" class="mt-5 space-y-3"></div></div><div class="box"><h2 class="text-xl font-black">Payment mix</h2><div id="mix" class="mt-5 space-y-4"></div></div></section><section class="grid lg:grid-cols-2 gap-5"><div class="box"><h2 class="text-xl font-black">Business signals</h2><div id="signals" class="mt-5 space-y-3"></div></div><div class="box"><h2 class="text-xl font-black">Operational summary</h2><div id="summary" class="mt-5 grid sm:grid-cols-2 gap-3"></div></div></section><section id="error" hidden class="box text-sm text-red-600"></section></main><script src="/centres/centre.js"></script></body></html>
